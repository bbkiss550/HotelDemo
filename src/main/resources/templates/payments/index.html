<!doctype html>
<html lang="th">
<head th:replace="~{fragments/head :: head('ชำระเงิน')}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div id="main">
        <header class="mb-3"><a href="#" class="burger-btn d-block d-xl-none"><i class="bi bi-justify fs-3"></i></a></header>
        <div class="page-heading d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h3 th:text="${currentMenuName}"></h3>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#payableBillPickerModal">
                    <i class="bi bi-list-check me-1"></i>เลือกบิลรอชำระ
                </button>
            </div>
        </div>
        <div class="page-content">
            <section class="section">
                <div class="modal fade" id="payableBillPickerModal" tabindex="-1" th:attr="data-auto-open=${billFilterApplied}">
                    <div class="modal-dialog modal-xl modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">เลือกบิลรอชำระ</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                <form class="floor-toolbar monthly-billing-filter payments-filter mb-3" id="payableBillFilterForm" method="get" th:action="@{/payments}">
                    <div class="billing-filter-controls">
                        <div>
                            <label class="form-label">เดือน</label>
                            <select class="form-select billing-month-select" name="month">
                                <option value="" th:selected="${billingMonth == null}">ทั้งหมด</option>
                                <option th:each="month : ${months}"
                                        th:value="${month.value}"
                                        th:text="${month.label}"
                                        th:selected="${billingMonth == month.value}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">ปี</label>
                            <select class="form-select billing-year-select" name="year">
                                <option value="" th:selected="${billingYear == null}">ทั้งหมด</option>
                                <option th:each="year : ${years}"
                                        th:value="${year}"
                                        th:text="${year + 543}"
                                        th:selected="${billingYear == year}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">สถานะบิล</label>
                            <select class="form-select" name="status">
                                <option value="ALL" th:selected="${selectedStatus == 'ALL'}">ทั้งหมด</option>
                                <option th:each="status : ${statuses}"
                                        th:value="${status.id}"
                                        th:text="${status.name}"
                                        th:selected="${selectedStatus == #strings.toString(status.id)}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">เลขบิล</label>
                            <input class="form-control" name="billNo" th:value="${billNo}" placeholder="เลขบิล">
                        </div>
                        <div>
                            <label class="form-label">เลขห้อง</label>
                            <input class="form-control" name="roomNo" th:value="${roomNo}" placeholder="เลขห้อง">
                        </div>
                        <div>
                            <label class="form-label">ชื่อผู้พัก</label>
                            <input class="form-control" name="guestName" th:value="${guestName}" placeholder="ชื่อผู้พัก">
                        </div>
                    </div>
                    <a class="btn btn-light-secondary" th:href="@{/payments}"><i class="bi bi-x-circle me-1"></i>ล้าง</a>
                </form>

                <div class="card mb-0">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h5 class="mb-0">บิลรอชำระ</h5>
                        <span class="badge bg-light-primary" th:text="|${payableBills.size()} รายการ|"></span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>เลขบิล</th>
                                    <th>รอบบิล</th>
                                    <th>ห้อง</th>
                                    <th>ผู้เช่า</th>
                                    <th class="text-end">ยอดสุทธิ</th>
                                    <th class="text-end">ชำระแล้ว</th>
                                    <th class="text-end">คงเหลือ</th>
                                    <th>ครบกำหนด</th>
                                    <th class="table-actions">รับชำระ</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="bill : ${payableBills}">
                                    <td class="fw-bold" th:text="${bill.displayBillNumber}"></td>
                                    <td th:text="${@thaiDate.monthYear(bill.billingMonth, bill.billingYear)}"></td>
                                    <td><span class="badge bg-light-primary" th:text="${bill.room != null ? bill.room.roomNumber : '-'}"></span></td>
                                    <td th:text="${bill.guest != null ? bill.guest.fullName : '-'}"></td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(bill.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(bill.paidAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td class="text-end fw-bold text-primary" th:text="${#numbers.formatDecimal(bill.remainingAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td th:text="${@thaiDate.format(bill.dueDate)}"></td>
                                    <td class="table-actions">
                                        <button class="btn btn-sm btn-success"
                                                type="button"
                                                data-payable-bill-pay="true"
                                                th:attr="data-payment-modal-url=@{/payments/monthly-bill/{id}/payment-modal(id=${bill.id})}">
                                            <i class="bi bi-cash me-1"></i>รับชำระ
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${payableBills.isEmpty()}">
                                    <td colspan="9" class="text-center text-muted py-4">ไม่พบบิลรอชำระ</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h5 class="mb-0">รายการชำระล่าสุด</h5>
                        <span class="badge bg-light-primary" th:text="|${payments.size()} รายการ|"></span>
                    </div>
                    <div class="card-body">
                        <form class="floor-toolbar monthly-billing-filter payments-filter payment-search-form mb-3" method="get" th:action="@{/payments}">
                            <div class="billing-filter-controls">
                                <div>
                                    <label class="form-label">เลขใบเสร็จ</label>
                                    <input class="form-control" name="receiptNo" th:value="${receiptNo}" placeholder="เลขใบเสร็จ">
                                </div>
                                <div>
                                    <label class="form-label">เลขที่เอกสารอ้างอิง</label>
                                    <input class="form-control" name="referenceNo" th:value="${referenceNo}" placeholder="เลขที่เอกสารอ้างอิง">
                                </div>
                                <div>
                                    <label class="form-label">วันที่ชำระ</label>
                                    <div class="date-box">
                                        <i class="bi bi-calendar-check"></i>
                                        <input class="form-control hotel-calendar-input" type="text" readonly data-calendar-for="paymentDate">
                                        <input class="hotel-calendar-value" type="hidden" name="paymentDate" th:value="${paymentDate}">
                                    </div>
                                </div>
                                <div>
                                    <label class="form-label">ชื่อผู้พัก</label>
                                    <input class="form-control" name="paymentGuestName" th:value="${paymentGuestName}" placeholder="ชื่อผู้พัก">
                                </div>
                                <div>
                                    <label class="form-label">ประเภทใบเสร็จ</label>
                                    <select class="form-select" name="receiptTypeId">
                                        <option value="" th:selected="${receiptTypeId == null}">ทั้งหมด</option>
                                        <option th:each="type : ${recieptTypes}"
                                                th:value="${type.id}"
                                                th:text="${type.name}"
                                                th:selected="${receiptTypeId == type.id}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex flex-wrap gap-2">
                                <a class="btn btn-light-secondary" th:href="@{/payments}"><i class="bi bi-x-circle me-1"></i>ล้าง</a>
                            </div>
                        </form>
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                <tr>
                                    <th class="table-actions">จัดการ</th>
                                    <th>เลขใบเสร็จ</th>
                                    <th>เลขที่ใบแจ้งค่าเช่า</th>
                                    <th>วันที่</th>
                                    <th>ห้อง</th>
                                    <th>ผู้พัก</th>
                                    <th>ประเภท</th>
                                    <th>วิธีชำระ</th>
                                    <th class="text-end">ยอดตามใบแจ้ง</th>
                                    <th class="text-end">ค่าปรับ</th>
                                    <th class="text-end">ยอดสุทธิ</th>
                                    <th>สถานะ</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="p : ${payments}" th:with="receiptNo=${paymentReceiptNumbers[p.id]}">
                                    <td class="table-actions">
                                        <button class="btn btn-sm btn-warning" type="button" th:attr="data-payment-modal-url=@{/payments/{id}/edit-modal(id=${p.id})}" title="แก้ไข"><i class="bi bi-pencil-square me-1"></i>แก้ไข</button>
                                        <button class="btn btn-sm btn-document-view"
                                                type="button"
                                                th:if="${receiptNo != null}"
                                                th:attr="data-payment-modal-url=@{/payments/{id}/receipt-modal(id=${p.id})},data-payment-fallback-url=@{/receipts/{id}(id=${p.id})}"
                                                title="ใบเสร็จ"><i class="bi bi-receipt me-1"></i>ใบเสร็จ</button>
                                    </td>
                                    <td class="fw-bold" th:text="${receiptNo != null ? receiptNo : '-'}"></td>
                                    <td class="fw-bold" th:text="${paymentBillNumbers[p.id] != null ? paymentBillNumbers[p.id] : '-'}"></td>
                                    <td th:text="${@thaiDate.format(p.paymentDate)}"></td>
                                    <td><span class="badge bg-light-primary" th:text="${p.room != null ? p.room.roomNumber : '-'}"></span></td>
                                    <td th:text="${paymentPayerNames[p.id] != null ? paymentPayerNames[p.id] : '-'}"></td>
                                    <td>
                                        <span class="badge receipt-type-badge"
                                              th:classappend="${paymentReceiptTypeNames[p.id] == 'ค่าแรกเข้ารายเดือน'} ? ' receipt-type-opening-monthly' : (${paymentReceiptTypeNames[p.id] == 'ค่าบริการของลูกค้ารายวัน'} ? ' receipt-type-daily-service' : (${paymentReceiptTypeNames[p.id] == 'ค่าเช่ารายเดือน'} ? ' receipt-type-monthly-rent' : ' receipt-type-unknown'))"
                                              th:text="${paymentReceiptTypeNames[p.id] != null ? paymentReceiptTypeNames[p.id] : '-'}"></span>
                                    </td>
                                    <td th:text="${p.paymentMethod}"></td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(p.fineAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(p.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td><span class="badge bg-light-success" th:text="${p.statusLabel}"></span></td>
                                </tr>
                                <tr th:if="${payments.isEmpty()}">
                                    <td colspan="12" class="text-center text-muted py-4">ยังไม่มีรายการชำระเงิน</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div id="paymentLazyModalHost"></div>
        <div id="paymentAutoReceipt"
             th:if="${autoReceiptPaymentId != null}"
             th:attr="data-payment-modal-url=@{/payments/{id}/receipt-modal(id=${autoReceiptPaymentId})}"
             hidden></div>

    </div>
</div>
<div th:replace="~{fragments/nav :: scripts}"></div>
<style>
#payableBillPickerModal .modal-dialog {
    max-height: calc(100vh - 2rem);
}

#payableBillPickerModal .modal-content {
    min-height: calc(100vh - 2rem);
}

#payableBillPickerModal .modal-body {
    max-height: calc(100vh - 8rem);
}

.payment-receipt-modal .monthly-bill-preview-wrap {
    overflow-x: hidden;
}

.payment-receipt-slip {
    max-width: calc(100vw - 4rem);
    width: min(210mm, 100%);
}

.payments-filter {
    overflow: hidden;
}

.payment-search-form {
    overflow: visible;
}

.payment-search-form .date-box {
    position: relative;
}

.payment-search-form .date-box i {
    align-items: center;
    color: var(--hotel-primary);
    display: flex;
    height: 100%;
    left: .85rem;
    pointer-events: none;
    position: absolute;
    top: 0;
    z-index: 1;
}

.payment-search-form .hotel-calendar-popup {
    left: 0;
    top: 100%;
}

.payments-filter .billing-filter-controls {
    grid-template-columns: repeat(auto-fit, minmax(min(8.5rem, 100%), 1fr));
    min-width: 0;
}

.receipt-type-badge {
    border: 1px solid transparent;
    font-weight: 800;
}

.receipt-type-opening-monthly {
    background: #dbeafe;
    border-color: #bfdbfe;
    color: #1d4ed8;
}

.receipt-type-daily-service {
    background: #dcfce7;
    border-color: #bbf7d0;
    color: #15803d;
}

.receipt-type-monthly-rent {
    background: #ede9fe;
    border-color: #ddd6fe;
    color: #6d28d9;
}

.receipt-type-unknown {
    background: #e2e8f0;
    border-color: #cbd5e1;
    color: #475569;
}
</style>
<script>
const paymentThaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const paymentThaiWeekdays = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const paymentPad = value => String(value).padStart(2, '0');
const paymentToIsoDate = date => `${date.getFullYear()}-${paymentPad(date.getMonth() + 1)}-${paymentPad(date.getDate())}`;
const paymentFormatDisplayDate = date => `${paymentPad(date.getDate())}/${paymentPad(date.getMonth() + 1)}/${date.getFullYear() + 543}`;
const paymentParseIsoDate = value => {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
    return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
};
const paymentSameDate = (a, b) => a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const paymentDayDiff = (start, end) => Math.round((end - start) / (24 * 60 * 60 * 1000));
const paymentMoneyFormatter = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const paymentParseMoney = value => {
    const parsed = Number(String(value || '0').replace(/,/g, ''));
    return Number.isFinite(parsed) ? parsed : 0;
};

const updatePaymentNetAmount = (form) => {
    if (!form) return;
    const baseAmount = paymentParseMoney(form.querySelector('.payment-base-amount')?.value);
    const fineAmount = Math.max(0, paymentParseMoney(form.querySelector('.payment-fine-amount')?.value));
    const target = form.querySelector('.payment-net-amount');
    if (target) target.value = paymentMoneyFormatter.format(baseAmount + fineAmount);
};

const updatePaymentOverdueDays = (form) => {
    const dueDate = paymentParseIsoDate(form.querySelector('.payment-due-date')?.dataset.dueDate);
    const paymentDate = paymentParseIsoDate(form.querySelector('[name="paymentDate"]')?.value);
    const target = form.querySelector('.payment-overdue-days');
    if (!target) return;
    const overdueDays = dueDate && paymentDate ? Math.max(0, paymentDayDiff(dueDate, paymentDate)) : 0;
    const fineInput = form.querySelector('.payment-fine-amount');
    if (fineInput) {
        if (overdueDays === 0) {
            fineInput.value = '0';
            fineInput.readOnly = true;
        } else {
            const intervalDays = Math.max(1, Number(fineInput.dataset.fineIntervalDays || '1'));
            const periods = Math.max(1, Math.ceil(overdueDays / intervalDays));
            fineInput.value = String(paymentParseMoney(fineInput.dataset.defaultFine) * periods);
            fineInput.readOnly = true;
        }
        updatePaymentNetAmount(form);
    }
    target.textContent = `${overdueDays} วัน`;
    target.classList.toggle('text-danger', overdueDays > 0);
    target.classList.toggle('text-success', overdueDays === 0);
};

const createPaymentCalendar = (hiddenInput, displayInput) => {
    if (displayInput.dataset.calendarReady === 'true') return;
    displayInput.dataset.calendarReady = 'true';
    const canClearDate = hiddenInput.dataset.defaultToday !== 'true';
    if (!hiddenInput.value && hiddenInput.dataset.defaultToday === 'true') hiddenInput.value = paymentToIsoDate(new Date());
    let selectedDate = paymentParseIsoDate(hiddenInput.value);
    let viewDate;
    if (!selectedDate) {
        selectedDate = new Date();
        viewDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
        displayInput.value = '';
    } else {
        viewDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
        displayInput.value = paymentFormatDisplayDate(selectedDate);
    }

    const popup = document.createElement('div');
    popup.className = 'hotel-calendar-popup d-none';
    displayInput.closest('.date-box').appendChild(popup);

    const selectDate = date => {
        selectedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        hiddenInput.value = paymentToIsoDate(selectedDate);
        displayInput.value = paymentFormatDisplayDate(selectedDate);
        hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
        updatePaymentOverdueDays(hiddenInput.closest('form'));
        popup.classList.add('d-none');
        render();
    };

    const render = () => {
        const start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
        start.setDate(start.getDate() - start.getDay());
        popup.innerHTML = `
            <div class="hotel-calendar-header">
                <button class="hotel-calendar-nav" type="button" data-nav="-1">&lsaquo;</button>
                <div class="hotel-calendar-title">${paymentThaiMonths[viewDate.getMonth()]} ${viewDate.getFullYear() + 543}</div>
                <button class="hotel-calendar-nav" type="button" data-nav="1">&rsaquo;</button>
            </div>
            <div class="hotel-calendar-weekdays">${paymentThaiWeekdays.map(day => `<span>${day}</span>`).join('')}</div>
            <div class="hotel-calendar-grid"></div>
            <div class="hotel-calendar-footer">
                ${canClearDate ? '<button class="hotel-calendar-clear" type="button">ล้างวันที่</button>' : ''}
                <button class="hotel-calendar-today" type="button">วันนี้</button>
            </div>
        `;
        const grid = popup.querySelector('.hotel-calendar-grid');
        for (let index = 0; index < 42; index++) {
            const date = new Date(start);
            date.setDate(start.getDate() + index);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'hotel-calendar-day';
            if (date.getMonth() !== viewDate.getMonth()) button.classList.add('is-muted');
            if (date.getDay() === 0) button.classList.add('is-weekend');
            if (hiddenInput.value && paymentSameDate(date, selectedDate)) button.classList.add('is-selected');
            button.textContent = date.getDate();
            button.addEventListener('click', () => selectDate(date));
            grid.appendChild(button);
        }
        popup.querySelectorAll('[data-nav]').forEach(button => {
            button.addEventListener('click', event => {
                event.stopPropagation();
                viewDate.setMonth(viewDate.getMonth() + Number(button.dataset.nav));
                render();
            });
        });
        popup.querySelector('.hotel-calendar-today').addEventListener('click', () => {
            const now = new Date();
            viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
            selectDate(now);
        });
        popup.querySelector('.hotel-calendar-clear')?.addEventListener('click', () => {
            hiddenInput.value = '';
            displayInput.value = '';
            selectedDate = new Date();
            viewDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
            hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
            updatePaymentOverdueDays(hiddenInput.closest('form'));
            popup.classList.add('d-none');
            render();
        });
    };

    displayInput.addEventListener('click', () => {
        document.querySelectorAll('.hotel-calendar-popup').forEach(item => {
            if (item !== popup) item.classList.add('d-none');
        });
        popup.classList.toggle('d-none');
    });
    render();
};

const initPaymentCalendars = (root = document) => {
    root.querySelectorAll('.monthly-bill-payment-form .hotel-calendar-input, .payment-edit-form .hotel-calendar-input, .payment-search-form .hotel-calendar-input').forEach(displayInput => {
        const hiddenInput = displayInput.closest('form')?.querySelector(`.hotel-calendar-value[name="${displayInput.dataset.calendarFor}"]`);
        if (hiddenInput) {
            createPaymentCalendar(hiddenInput, displayInput);
            if (hiddenInput.dataset.paymentChangeReady !== 'true') {
                hiddenInput.dataset.paymentChangeReady = 'true';
                hiddenInput.addEventListener('change', () => updatePaymentOverdueDays(hiddenInput.closest('form')));
            }
            updatePaymentOverdueDays(hiddenInput.closest('form'));
        }
    });
};

const initPaymentForms = (root = document) => {
    root.querySelectorAll('.monthly-bill-payment-form').forEach(form => {
        if (form.dataset.paymentFormReady === 'true') {
            updatePaymentNetAmount(form);
            return;
        }
        form.dataset.paymentFormReady = 'true';
        form.querySelectorAll('.payment-base-amount, .payment-fine-amount').forEach(input => {
            input.addEventListener('input', () => updatePaymentNetAmount(form));
        });
        updatePaymentNetAmount(form);
    });
};

initPaymentCalendars();
initPaymentForms();

document.addEventListener('click', event => {
    if (!event.target.closest('.date-box')) {
        document.querySelectorAll('.hotel-calendar-popup').forEach(item => item.classList.add('d-none'));
    }
});

const payableBillPickerModal = document.getElementById('payableBillPickerModal');
if (payableBillPickerModal?.dataset.autoOpen === 'true') {
    bootstrap.Modal.getOrCreateInstance(payableBillPickerModal).show();
}

const payableBillFilterForm = document.getElementById('payableBillFilterForm');
if (payableBillFilterForm) {
    let filterTimer = null;
    const submitFilter = () => {
        window.clearTimeout(filterTimer);
        filterTimer = window.setTimeout(() => payableBillFilterForm.requestSubmit(), 350);
    };
    payableBillFilterForm.querySelectorAll('select').forEach(input => {
        input.addEventListener('change', submitFilter);
    });
    payableBillFilterForm.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', submitFilter);
    });
}

const paymentSearchForm = document.querySelector('.payment-search-form');
if (paymentSearchForm) {
    let paymentSearchTimer = null;
    const submitPaymentSearch = () => {
        window.clearTimeout(paymentSearchTimer);
        paymentSearchTimer = window.setTimeout(() => paymentSearchForm.requestSubmit(), 350);
    };
    paymentSearchForm.querySelectorAll('select, .hotel-calendar-value').forEach(input => {
        input.addEventListener('change', submitPaymentSearch);
    });
    paymentSearchForm.querySelectorAll('input:not(.hotel-calendar-value):not(.hotel-calendar-input)').forEach(input => {
        input.addEventListener('input', submitPaymentSearch);
    });
}

document.querySelectorAll('[data-payable-bill-pay="true"]').forEach(button => {
    button.addEventListener('click', () => {
        if (!payableBillPickerModal) return;
        bootstrap.Modal.getInstance(payableBillPickerModal)?.hide();
    });
});

document.addEventListener('click', event => {
    const button = event.target.closest('.payment-receipt-print-btn');
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();
    const slip = button.closest('.modal')?.querySelector('.monthly-bill-slip');
    if (!slip) return;
    document.querySelector('.monthly-bill-print-root')?.remove();
    const root = document.createElement('div');
    root.className = 'monthly-bill-print-root';
    const wrap = document.createElement('div');
    wrap.className = 'monthly-bill-preview-wrap';
    wrap.appendChild(slip.cloneNode(true));
    root.appendChild(wrap);
    document.body.appendChild(root);
    document.body.classList.add('printing-monthly-bills');
    const cleanupPrint = () => {
        root.remove();
        document.body.classList.remove('printing-monthly-bills');
        window.removeEventListener('afterprint', cleanupPrint);
    };
    window.addEventListener('afterprint', cleanupPrint, { once: true });
    window.setTimeout(() => window.print(), 50);
    window.setTimeout(cleanupPrint, 3000);
});

const initPaymentReceiptModals = (root = document) => {
    root.querySelectorAll('.payment-receipt-modal').forEach(modal => {
        if (modal.dataset.receiptCleanupReady === 'true') return;
        modal.dataset.receiptCleanupReady = 'true';
        modal.addEventListener('hidden.bs.modal', () => {
            modal.remove();
            document.querySelector('.monthly-bill-print-root')?.remove();
            document.body.classList.remove('printing-monthly-bills');
            if (!document.querySelector('.modal.show')) {
                document.body.classList.remove('modal-open');
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('padding-right');
                document.querySelectorAll('.modal-backdrop').forEach(item => item.remove());
            }
        });
    });
};

const paymentLazyModalHost = document.getElementById('paymentLazyModalHost');
const forceShowPaymentModalElement = (modal) => {
    modal.style.display = 'block';
    modal.style.zIndex = '2400';
    modal.removeAttribute('aria-hidden');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('role', 'dialog');
    modal.classList.add('show');
    document.body.classList.add('modal-open');
    let backdrop = document.querySelector('.payment-lazy-backdrop');
    if (!backdrop) {
        backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop fade show payment-lazy-backdrop';
        backdrop.style.zIndex = '2390';
        document.body.appendChild(backdrop);
    }
    const closeModal = () => {
        modal.classList.remove('show');
        modal.style.display = 'none';
        modal.style.removeProperty('z-index');
        modal.setAttribute('aria-hidden', 'true');
        modal.removeAttribute('aria-modal');
        document.body.classList.remove('modal-open');
        document.querySelectorAll('.payment-lazy-backdrop').forEach(item => item.remove());
        modal.dispatchEvent(new Event('hidden.bs.modal'));
    };
    if (modal.dataset.paymentEscapeCloseReady !== 'true') {
        modal.dataset.paymentEscapeCloseReady = 'true';
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && modal.classList.contains('show') && !document.querySelector('.swal2-container.swal2-shown')) {
                closeModal();
            }
        }, true);
    }
    if (backdrop.dataset.paymentFallbackCloseReady !== 'true') {
        backdrop.dataset.paymentFallbackCloseReady = 'true';
        backdrop.addEventListener('click', closeModal);
    }
    if (modal.dataset.paymentOutsideCloseReady !== 'true') {
        modal.dataset.paymentOutsideCloseReady = 'true';
        modal.addEventListener('mousedown', event => {
            if (event.target === modal) closeModal();
        });
    }
    modal.querySelectorAll('[data-bs-dismiss="modal"], .btn-close').forEach(button => {
        if (button.dataset.paymentFallbackCloseReady === 'true') return;
        button.dataset.paymentFallbackCloseReady = 'true';
        button.addEventListener('click', closeModal);
    });
    return true;
};

const showPaymentModalElement = (modal) => {
    if (!modal) return false;
    modal.setAttribute('data-bs-backdrop', 'true');
    modal.setAttribute('data-bs-keyboard', 'true');
    try {
        if (window.bootstrap && window.bootstrap.Modal) {
            window.bootstrap.Modal.getOrCreateInstance(modal, { backdrop: true, keyboard: true }).show();
            if (modal.dataset.paymentOutsideCloseReady !== 'true') {
                modal.dataset.paymentOutsideCloseReady = 'true';
                modal.addEventListener('mousedown', event => {
                    if (event.target === modal) {
                        window.bootstrap.Modal.getInstance(modal)?.hide();
                    }
                });
            }
            window.setTimeout(() => {
                if (!modal.classList.contains('show')) forceShowPaymentModalElement(modal);
            }, 80);
            return true;
        }
    } catch (error) {
        console.error('Bootstrap modal show failed:', error);
    }
    return forceShowPaymentModalElement(modal);
};

const requestPaymentModalHtml = (url) => {
    if (typeof window.fetch === 'function') {
        return fetch(url, {
            credentials: 'same-origin',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
        });
    }
    return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open('GET', url, true);
        request.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        request.onload = () => {
            if (request.status >= 200 && request.status < 300) resolve(request.responseText);
            else reject(new Error(`HTTP ${request.status}`));
        };
        request.onerror = () => reject(new Error('Network error'));
        request.send();
    });
};

const showPaymentFallbackModal = (url) => {
    if (!url || !paymentLazyModalHost) return false;
    paymentLazyModalHost.innerHTML = `
        <div class="modal fade payment-receipt-modal" id="paymentReceiptFallbackModal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">ใบเสร็จรับเงิน</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-0" style="height: min(82vh, 56rem);">
                        <iframe src="${url}" title="ใบเสร็จรับเงิน" style="border:0;height:100%;width:100%;"></iframe>
                    </div>
                </div>
            </div>
        </div>`;
    const modal = paymentLazyModalHost.querySelector('.modal');
    if (!modal) return false;
    modal.addEventListener('hidden.bs.modal', () => modal.remove(), { once: true });
    return showPaymentModalElement(modal);
};

const loadPaymentModal = async (url, fallbackUrl = '') => {
    if (!url || !paymentLazyModalHost) return;
    window.hotelLoading?.start();
    try {
        const html = await requestPaymentModalHtml(url);
        paymentLazyModalHost.innerHTML = html;
        initPaymentCalendars(paymentLazyModalHost);
        initPaymentForms(paymentLazyModalHost);
        initPaymentReceiptModals(paymentLazyModalHost);
        const modal = paymentLazyModalHost.querySelector('.modal');
        if (!modal) {
            if (html.includes('name="username"') || html.includes('/login')) {
                window.location.href = '/login';
                return;
            }
            throw new Error('Modal markup not found');
        }
        showPaymentModalElement(modal);
    } catch (error) {
        console.error('Payment modal load failed:', error);
        if (!showPaymentFallbackModal(fallbackUrl)) {
            window.showAlert?.('warning', 'โหลดข้อมูลไม่สำเร็จ');
        }
    } finally {
        window.hotelLoading?.finish();
    }
};

document.addEventListener('click', event => {
    const button = event.target.closest('[data-payment-modal-url]');
    if (!button) return;
    event.preventDefault();
    loadPaymentModal(button.dataset.paymentModalUrl, button.dataset.paymentFallbackUrl || '');
});

initPaymentReceiptModals();

const paymentAutoReceipt = document.getElementById('paymentAutoReceipt');
if (paymentAutoReceipt?.dataset.paymentModalUrl) {
    loadPaymentModal(paymentAutoReceipt.dataset.paymentModalUrl);
}
</script>
</body>
