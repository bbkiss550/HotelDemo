<!doctype html>
<html lang="th">
<head th:replace="~{fragments/head :: head('ตั้งค่าเริ่มต้น')}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div id="main">
        <header class="mb-3"><a href="#" class="burger-btn d-block d-xl-none"><i class="bi bi-justify fs-3"></i></a></header>
        <div class="page-heading">
            <h3 th:text="${currentMenuName}"></h3>
        </div>
        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <form method="post" th:action="@{/settings/defaults}">
                            <div class="row g-3">
                                <div class="col-lg-6 col-md-12">
                                    <label class="form-label">ชื่อระบบ</label>
                                    <input class="form-control" name="systemName" type="text" th:value="${systemNameValue}" required>
                                </div>
                                <div class="col-lg-3 col-md-6">
                                    <label class="form-label">ค่าประกัน</label>
                                    <input class="form-control" name="defaultDeposit" type="number" min="0" step="0.01" th:value="${settings['default_deposit']}" required>
                                </div>
                                <div class="col-lg-3 col-md-6">
                                    <label class="form-label">หน่วยไฟ</label>
                                    <input class="form-control" name="electricRate" type="number" min="0" step="0.01" th:value="${settings['electric_rate']}" required>
                                </div>
                                <div class="col-lg-3 col-md-6">
                                    <label class="form-label">หน่วยน้ำ</label>
                                    <input class="form-control" name="waterRate" type="number" min="0" step="0.01" th:value="${settings['water_rate']}" required>
                                </div>
                                <div class="col-lg-3 col-md-6">
                                    <label class="form-label">ค่าปรับ</label>
                                    <input class="form-control" name="fineAmount" type="number" min="0" step="0.01" th:value="${settings['fine_amount']}" required>
                                </div>
                                <div class="col-lg-3 col-md-6">
                                    <label class="form-label">คิดค่าปรับทุกกี่วัน</label>
                                    <input class="form-control" name="fineIntervalDays" type="number" min="1" step="1" th:value="${fineIntervalDaysValue}" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>บันทึก</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
