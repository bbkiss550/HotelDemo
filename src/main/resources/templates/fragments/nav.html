<div th:fragment="nav">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-end">
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div class="sidebar-menu">
                <ul class="menu">
                    <li th:each="menu : ${sidebarMenus}"
                        th:class="${'sidebar-item' + (menu.hasChildren() ? ' has-sub' : '')}">
                        <a class="sidebar-link"
                           th:href="${menu.link != null and !#strings.isEmpty(menu.link) ? menu.link : '#'}">
                            <i th:if="${menu.icon != null and !#strings.isEmpty(menu.icon)}" th:class="${#strings.startsWith(menu.icon, 'bi ') ? menu.icon : 'bi ' + menu.icon}"></i>
                            <span th:text="${menu.name}"></span>
                        </a>
                        <ul class="submenu" th:if="${menu.hasChildren()}">
                            <li th:each="child : ${menu.children}"
                                th:class="${'submenu-item' + (child.hasChildren() ? ' has-sub' : '')}">
                                <a class="submenu-link"
                                   th:href="${child.link != null and !#strings.isEmpty(child.link) ? child.link : '#'}">
                                    <i th:if="${child.icon != null and !#strings.isEmpty(child.icon)}" th:class="${#strings.startsWith(child.icon, 'bi ') ? child.icon : 'bi ' + child.icon}"></i>
                                    <span th:text="${child.name}"></span>
                                </a>
                                <ul class="submenu" th:if="${child.hasChildren()}">
                                    <li th:each="grandchild : ${child.children}" class="submenu-item">
                                        <a class="submenu-link"
                                           th:href="${grandchild.link != null and !#strings.isEmpty(grandchild.link) ? grandchild.link : '#'}">
                                            <i th:if="${grandchild.icon != null and !#strings.isEmpty(grandchild.icon)}" th:class="${#strings.startsWith(grandchild.icon, 'bi ') ? grandchild.icon : 'bi ' + grandchild.icon}"></i>
                                            <span th:text="${grandchild.name}"></span>
                                        </a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div class="app-topbar">
        <button class="btn btn-outline-secondary sidebar-collapse-btn d-none d-xl-inline-flex" type="button" id="hotelSidebarToggle" aria-label="ย่อหรือขยายแถบเมนู">
            <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
        </button>
        <a class="topbar-system-name text-decoration-none" th:href="@{/}" th:text="${systemName}">BlueCatHotelDemo</a>
        <div class="topbar-spacer" aria-hidden="true"></div>
        <div class="topbar-actions">
            <div class="dropdown">
                <button class="btn topbar-notification-btn position-relative" type="button" id="hotelNotificationToggle"
                        data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                        aria-label="การแจ้งเตือน" title="การแจ้งเตือน">
                    <i class="bi bi-bell" aria-hidden="true"></i>
                    <span class="notification-badge"
                          th:if="${notificationSummary.totalCount > 0}"
                          th:text="${notificationSummary.totalCount > 99 ? '99+' : notificationSummary.totalCount}">0</span>
                </button>
                <div class="dropdown-menu dropdown-menu-end notification-dropdown" aria-labelledby="hotelNotificationToggle">
                    <div class="notification-dropdown-header">
                        <div>
                            <div class="fw-bold">การแจ้งเตือน</div>
                            <small class="text-muted">รายการที่ต้องติดตาม</small>
                        </div>
                        <span class="badge bg-light-danger text-danger" th:text="${notificationSummary.totalCount}">0</span>
                    </div>
                    <div class="notification-section" th:if="${notificationSummary.overdueDailyStayCount > 0}">
                        <a class="notification-section-title" th:href="@{/guests}">
                            <span><i class="bi bi-door-open me-2 text-warning"></i>ห้องรายวันเกินกำหนด</span>
                            <span class="badge bg-light-warning text-warning" th:text="${notificationSummary.overdueDailyStayCount}">0</span>
                        </a>
                        <a class="notification-item" th:each="guest : ${notificationSummary.overdueDailyGuests}" th:href="@{/guests}">
                            <span class="notification-item-icon notification-item-icon-warning"><i class="bi bi-person-exclamation"></i></span>
                            <span class="notification-item-content">
                                <strong th:text="${guest.room.roomNumber}">101</strong>
                                <span th:text="${guest.fullName}">ชื่อผู้พัก</span>
                            </span>
                            <small th:text="|ออก ${@thaiDate.format(guest.checkOutDate)}|">ออก</small>
                        </a>
                    </div>
                    <div class="notification-section" th:if="${notificationSummary.overdueBillCount > 0}">
                        <a class="notification-section-title" th:href="@{/finance/monthly-rent/bills(status='OVERDUE')}">
                            <span><i class="bi bi-receipt-cutoff me-2 text-danger"></i>บิลค้างชำระ</span>
                            <span class="badge bg-light-danger text-danger" th:text="${notificationSummary.overdueBillCount}">0</span>
                        </a>
                        <a class="notification-item" th:each="bill : ${notificationSummary.overdueBills}" th:href="@{/finance/monthly-rent/bills(status='OVERDUE')}">
                            <span class="notification-item-icon notification-item-icon-danger"><i class="bi bi-receipt"></i></span>
                            <span class="notification-item-content">
                                <strong th:text="${bill.room.roomNumber}">101</strong>
                                <span th:text="${bill.billNumber}">BILL-001</span>
                            </span>
                            <small th:text="|ครบกำหนด ${@thaiDate.format(bill.dueDate)}|">ครบกำหนด</small>
                        </a>
                    </div>
                    <div class="notification-empty" th:if="${notificationSummary.totalCount == 0}">
                        <i class="bi bi-bell-slash"></i>
                        <span>ไม่มีรายการที่ต้องติดตาม</span>
                    </div>
                </div>
            </div>
            <button class="btn btn-outline-secondary theme-toggle-btn" type="button" id="hotelThemeToggle" aria-label="Toggle dark mode">
                <i class="bi bi-sun theme-light-icon" aria-hidden="true"></i>
                <i class="bi bi-moon theme-dark-icon" aria-hidden="true"></i>
                <span class="theme-toggle-text">Light</span>
            </button>
            <span class="topbar-user">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">admin</span>
            </span>
            <form method="post" th:action="@{/logout}" class="mb-0">
                <button class="btn btn-outline-danger" type="submit">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</div>

<div th:fragment="scripts">
    <div class="hotel-loading-bar" aria-hidden="true"></div>
    <div class="hotel-loading-blocker" aria-hidden="true"></div>
    <div class="hotel-loading-panel" role="status" aria-live="polite">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>กำลังโหลด...</span>
    </div>
    <div class="hotel-toast-container" id="hotelToastContainer" role="region" aria-live="polite" aria-atomic="false"></div>
    <div id="serverFlashToast"
         th:if="${message != null or error != null}"
         th:data-type="${error != null ? 'warning' : (flashType != null ? flashType : 'success')}"
         th:data-message="${error != null ? error : message}"
         hidden></div>
    <script th:src="@{/mazer/dist/assets/vendors/sweetalert2/sweetalert2.all.min.js}"></script>
    <script>
        (function () {
            const sweetAlert = window.Swal || window.Sweetalert2;
            if (sweetAlert && !window.Swal) window.Swal = sweetAlert;
            const themeToggle = document.getElementById('hotelThemeToggle');
            const sidebarToggle = document.getElementById('hotelSidebarToggle');
            const setSidebarCollapsed = (collapsed) => {
                document.documentElement.classList.toggle('hotel-sidebar-collapsed', collapsed);
                document.body.classList.toggle('hotel-sidebar-collapsed', collapsed);
                sidebarToggle?.setAttribute('aria-pressed', String(collapsed));
                try {
                    localStorage.setItem('hotel-sidebar-collapsed', collapsed ? 'true' : 'false');
                } catch (error) {
                    /* localStorage can be unavailable in private contexts. */
                }
            };

            try {
                setSidebarCollapsed(localStorage.getItem('hotel-sidebar-collapsed') === 'true');
            } catch (error) {
                setSidebarCollapsed(false);
            }

            let sidebarTransitionTimer;
            sidebarToggle?.addEventListener('click', () => {
                window.clearTimeout(sidebarTransitionTimer);
                document.body.classList.add('hotel-sidebar-transitioning');
                document.body.offsetWidth;
                setSidebarCollapsed(!document.body.classList.contains('hotel-sidebar-collapsed'));
                sidebarTransitionTimer = window.setTimeout(() => {
                    document.body.classList.remove('hotel-sidebar-transitioning');
                }, 540);
            });

            document.querySelectorAll('.sidebar-item > .sidebar-link').forEach((link) => {
                const label = link.textContent.trim();
                if (label) {
                    link.dataset.menuShort = label.slice(0, 1);
                    link.setAttribute('title', label);
                }
            });

            const setTheme = (theme) => {
                const normalizedTheme = theme === 'dark' ? 'dark' : 'light';
                document.documentElement.dataset.theme = normalizedTheme;
                document.documentElement.classList.toggle('hotel-dark-mode', normalizedTheme === 'dark');
                themeToggle?.setAttribute('aria-pressed', String(normalizedTheme === 'dark'));
                const label = themeToggle?.querySelector('.theme-toggle-text');
                if (label) label.textContent = normalizedTheme === 'dark' ? 'Dark' : 'Light';
                try {
                    localStorage.setItem('hotel-theme', normalizedTheme);
                } catch (error) {
                    /* localStorage can be unavailable in private contexts. */
                }
            };

            if (themeToggle) {
                setTheme(document.documentElement.dataset.theme || 'light');
                themeToggle.addEventListener('click', () => {
                    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
                });
            }

            let loadingCount = 0;
            let loadingTimer = null;
            const showLoading = () => {
                window.clearTimeout(loadingTimer);
                document.body.classList.add('hotel-is-loading');
            };
            const hideLoading = () => {
                window.clearTimeout(loadingTimer);
                loadingTimer = window.setTimeout(() => {
                    if (loadingCount <= 0) document.body.classList.remove('hotel-is-loading');
                }, 180);
            };
            window.hotelLoading = {
                start() {
                    loadingCount += 1;
                    showLoading();
                },
                finish() {
                    loadingCount = Math.max(0, loadingCount - 1);
                    if (loadingCount === 0) hideLoading();
                }
            };
            const blockWhileLoading = event => {
                if (!document.body.classList.contains('hotel-is-loading')) return;
                event.preventDefault();
                event.stopImmediatePropagation();
            };
            ['click', 'submit', 'keydown', 'pointerdown', 'touchstart'].forEach(type => {
                document.addEventListener(type, blockWhileLoading, true);
            });

            if (typeof window.fetch === 'function' && !window.fetch.__hotelLoadingWrapped) {
                const originalFetch = window.fetch.bind(window);
                const wrappedFetch = (...args) => {
                    window.hotelLoading.start();
                    return originalFetch(...args).finally(() => window.hotelLoading.finish());
                };
                wrappedFetch.__hotelLoadingWrapped = true;
                window.fetch = wrappedFetch;
            }

            document.addEventListener('click', async event => {
                const link = event.target.closest('.report-pdf-download');
                if (!link || !window.fetch) return;
                event.preventDefault();
                window.hotelLoading.start();
                try {
                    const response = await window.fetch(link.href, { credentials: 'same-origin' });
                    if (!response.ok) throw new Error('Unable to generate report PDF');
                    const file = await response.blob();
                    const downloadUrl = URL.createObjectURL(file);
                    const anchor = document.createElement('a');
                    anchor.href = downloadUrl;
                    anchor.download = 'report.pdf';
                    document.body.appendChild(anchor);
                    anchor.click();
                    anchor.remove();
                    window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
                } catch (error) {
                    if (window.Swal) {
                        window.Swal.fire({ icon: 'error', title: 'ไม่สามารถสร้างรายงานได้' });
                    }
                } finally {
                    window.hotelLoading.finish();
                }
            });

            const legacyReportPreviewModal = () => {
                let modal = document.getElementById('reportPdfPreviewModal');
                if (modal) return modal;
                modal = document.createElement('div');
                modal.id = 'reportPdfPreviewModal';
                modal.className = 'modal fade';
                modal.tabIndex = -1;
                modal.innerHTML = `
                    <div class="modal-dialog modal-xl modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header"><h5 class="modal-title">ดูตัวอย่างรายงาน</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                            <div class="modal-body p-0" style="height:75vh"><iframe class="report-pdf-frame" title="ตัวอย่างรายงาน PDF" style="width:100%;height:100%;border:0"></iframe></div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ปิด</button>
                                <a class="btn btn-primary report-pdf-save" download><i class="bi bi-download me-1"></i>บันทึกไฟล์</a>
                                <button type="button" class="btn btn-light-primary report-pdf-print"><i class="bi bi-printer me-1"></i>พิมพ์</button>
                            </div>
                        </div>
                    </div>`;
                document.body.appendChild(modal);
                modal.querySelector('.report-pdf-print').addEventListener('click', () => {
                    modal.querySelector('.report-pdf-frame')?.contentWindow?.print();
                });
                modal.addEventListener('hidden.bs.modal', () => {
                    modal.querySelector('.report-pdf-frame').src = 'about:blank';
                });
                return modal;
            };

            document.addEventListener('click', event => {
                const button = event.target.closest('.legacy-report-pdf-preview');
                if (!button) return;
                event.preventDefault();
                const downloadLink = document.querySelector('.report-pdf-download');
                if (!downloadLink) return;
                const pdfUrl = new URL(downloadLink.href, window.location.origin);
                pdfUrl.searchParams.set('inline', 'true');
                const modal = legacyReportPreviewModal();
                const frame = modal.querySelector('.report-pdf-frame');
                window.hotelLoading.start();
                const finishLoading = () => window.hotelLoading.finish();
                frame.addEventListener('load', finishLoading, { once: true });
                frame.addEventListener('error', () => {
                    window.hotelLoading.finish();
                    if (window.Swal) {
                        window.Swal.fire({ icon: 'error', title: 'ไม่สามารถสร้างตัวอย่างรายงานได้' });
                    }
                }, { once: true });
                modal.querySelector('.report-pdf-save').href = downloadLink.href;
                frame.src = pdfUrl;
                if (window.bootstrap) window.bootstrap.Modal.getOrCreateInstance(modal).show();
            });

            const confirmWithSweetAlert = (message) => {
                if (!window.Swal) {
                    return Promise.resolve({ isConfirmed: window.confirm(message) });
                }
                return window.Swal.fire({
                    customClass: {
                        popup: 'hotel-swal-popup',
                        title: 'hotel-swal-title',
                        htmlContainer: 'hotel-swal-text',
                        confirmButton: 'hotel-swal-confirm',
                        cancelButton: 'hotel-swal-cancel'
                    },
                    icon: 'warning',
                    title: 'ยืนยันการทำรายการ',
                    text: message,
                    showCancelButton: true,
                    confirmButtonText: 'ยืนยัน',
                    cancelButtonText: 'ยกเลิก',
                    confirmButtonColor: '#dc3545',
                    cancelButtonColor: '#6c757d'
                });
            };

            document.addEventListener('submit', event => {
                const form = event.target;
                const message = form?.dataset?.swalConfirm;
                if (message && form.dataset.swalConfirmed !== 'true') {
                    event.preventDefault();
                    confirmWithSweetAlert(message).then(result => {
                        if (result.isConfirmed) {
                            form.dataset.swalConfirmed = 'true';
                            form.requestSubmit();
                        }
                    });
                    return;
                }
                if (form?.dataset?.swalConfirmed === 'true') {
                    delete form.dataset.swalConfirmed;
                }
                if (!event.defaultPrevented) window.hotelLoading.start();
            });

            document.addEventListener('click', event => {
                const button = event.target.closest('[data-swal-confirm][type="submit"]');
                if (!button || button.dataset.swalConfirmed === 'true') return;
                const form = button.form;
                if (!form || form.dataset.swalConfirm) return;
                event.preventDefault();
                confirmWithSweetAlert(button.dataset.swalConfirm).then(result => {
                    if (result.isConfirmed) {
                        button.dataset.swalConfirmed = 'true';
                        button.click();
                        delete button.dataset.swalConfirmed;
                    }
                });
            }, true);

            document.addEventListener('click', event => {
                const link = event.target.closest('a[href]');
                if (!link || link.target || link.hasAttribute('download')) return;
                if (event.defaultPrevented) return;
                const href = link.getAttribute('href');
                if (link.dataset.bsToggle || href === '#' || href.startsWith('#')) return;
                if (link.origin === window.location.origin) window.hotelLoading.start();
            });

            window.addEventListener('pageshow', () => {
                loadingCount = 0;
                document.body.classList.remove('hotel-is-loading');
            });

            const alertConfig = {
                create: { className: 'hotel-toast-create', icon: 'bi-check-circle' },
                success: { className: 'hotel-toast-success', icon: 'bi-check-circle' },
                update: { className: 'hotel-toast-update', icon: 'bi-pencil-square' },
                edit: { className: 'hotel-toast-edit', icon: 'bi-pencil-square' },
                delete: { className: 'hotel-toast-delete', icon: 'bi-trash3' },
                danger: { className: 'hotel-toast-danger', icon: 'bi-trash3' },
                warning: { className: 'hotel-toast-warning', icon: 'bi-exclamation-triangle' }
            };
            let alertSequence = 0;

            const normalizeAlertType = (type) => alertConfig[type] ? type : 'warning';
            const dismissToastElement = (toast) => {
                if (!toast || !toast.isConnected || toast.classList.contains('is-hiding')) return;
                toast.classList.add('is-hiding');
                window.setTimeout(() => toast.remove(), 900);
            };

            window.dismissAlert = function (id) {
                dismissToastElement(document.getElementById(id));
            };

            window.showAlert = function (type, message, duration = 3000) {
                const container = document.getElementById('hotelToastContainer');
                if (!container || !message) return null;

                const normalizedType = normalizeAlertType(type);
                const config = alertConfig[normalizedType];
                const id = `hotel-toast-${Date.now()}-${++alertSequence}`;
                const toast = document.createElement('div');
                toast.id = id;
                toast.className = `hotel-toast-item ${config.className}`;
                toast.setAttribute('role', 'alert');
                toast.setAttribute('aria-live', 'polite');
                toast.innerHTML = `
                    <i class="bi ${config.icon}" aria-hidden="true"></i>
                    <span class="hotel-toast-message"></span>
                    <button class="hotel-toast-close" type="button" aria-label="ปิดการแจ้งเตือน">&times;</button>
                `;
                toast.querySelector('.hotel-toast-message').textContent = message;
                container.prepend(toast);

                let removeTimer = null;
                const dismiss = () => {
                    window.clearTimeout(removeTimer);
                    dismissToastElement(toast);
                };

                toast.querySelector('.hotel-toast-close').addEventListener('click', dismiss);
                removeTimer = window.setTimeout(dismiss, Number(duration) || 3000);
                return id;
            };

            const serverFlashToast = document.getElementById('serverFlashToast');
            if (serverFlashToast) {
                serverFlashToast.dataset.shown = 'true';
                window.showAlert(serverFlashToast.dataset.type, serverFlashToast.dataset.message);
            }

            const captureDocumentTarget = async (target, fileName) => {
                if (!target) return;
                try {
                    await document.fonts?.ready;
                    const rect = target.getBoundingClientRect();
                    const width = Math.ceil(Math.max(target.scrollWidth, rect.width));
                    const height = Math.ceil(Math.max(target.scrollHeight, rect.height));
                    if (!width || !height) throw new Error('Invalid capture size');

                    const clone = target.cloneNode(true);
                    const copyComputedStyles = (source, destination) => {
                        const computed = window.getComputedStyle(source);
                        destination.style.cssText = Array.from(computed)
                            .map(name => `${name}:${computed.getPropertyValue(name)};`)
                            .join('');
                        destination.querySelectorAll?.('*').forEach((child, index) => {
                            const sourceChild = source.querySelectorAll('*')[index];
                            if (sourceChild) copyComputedStyles(sourceChild, child);
                        });
                    };
                    copyComputedStyles(target, clone);
                    clone.style.boxSizing = 'border-box';
                    clone.style.height = `${height}px`;
                    clone.style.margin = '0';
                    clone.style.width = `${width}px`;

                    const wrapper = document.createElement('div');
                    wrapper.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
                    wrapper.style.background = '#ffffff';
                    wrapper.style.height = `${height}px`;
                    wrapper.style.margin = '0';
                    wrapper.style.overflow = 'hidden';
                    wrapper.style.width = `${width}px`;
                    wrapper.appendChild(clone);

                    const html = new XMLSerializer().serializeToString(wrapper);
                    const svg = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
                            <foreignObject width="100%" height="100%">${html}</foreignObject>
                        </svg>
                    `;
                    const svgUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
                    const image = new Image();
                    image.decoding = 'async';
                    const scale = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.ceil(width * scale);
                    canvas.height = Math.ceil(height * scale);
                    const context = canvas.getContext('2d');
                    context.fillStyle = '#ffffff';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    await new Promise((resolve, reject) => {
                        image.onload = resolve;
                        image.onerror = reject;
                        image.src = svgUrl;
                    });
                    context.drawImage(image, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(svgUrl);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    if (!blob) throw new Error('Cannot create image');
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${(fileName || 'document').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'document'}.png`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                    window.showAlert?.('success', 'บันทึกรูปภาพแล้ว');
                } catch (error) {
                    console.error('Document capture failed:', error);
                    window.showAlert?.('warning', 'บันทึกรูปภาพไม่สำเร็จ');
                }
            };

            const documentCaptureTarget = (modal) => {
                const slips = modal.querySelectorAll('.monthly-bill-slip');
                if (slips.length > 1) return modal.querySelector('.monthly-bill-preview-wrap') || slips[0];
                return slips[0] || modal.querySelector('.bill-slip-preview');
            };

            const ensureDocumentCaptureButtons = (root = document) => {
                const modals = root.matches?.('.modal')
                    ? [root]
                    : Array.from(root.querySelectorAll?.('.modal') || []);
                modals.forEach(modal => {
                    if (modal.dataset.captureButtonReady === 'true') return;
                    const footer = modal.querySelector('.modal-footer');
                    if (!footer || !documentCaptureTarget(modal)) return;
                    modal.dataset.captureButtonReady = 'true';
                    const button = document.createElement('button');
                    button.className = 'btn btn-light-primary document-capture-btn';
                    button.type = 'button';
                    button.innerHTML = '<i class="bi bi-camera me-1"></i>บันทึกรูป';
                    button.addEventListener('click', () => {
                        const target = documentCaptureTarget(modal);
                        const title = modal.querySelector('.modal-title')?.textContent?.replace(/\s+/g, ' ').trim();
                        if (window.hotelCaptureElement) window.hotelCaptureElement(target, title);
                        else captureDocumentTarget(target, title);
                    });
                    const actionGroup = footer.querySelector('.d-flex.gap-2:last-child');
                    (actionGroup || footer).insertBefore(button, actionGroup ? actionGroup.firstChild : footer.lastElementChild);

    <script>
        (function () {
            const toast = (type, message) => {
                if (typeof window.showAlert === 'function') window.showAlert(type, message);
            };
            const fileSafeName = value => (value || 'document').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim() || 'document';
            const documentCanvasOptions = () => ({
                backgroundColor: '#ffffff',
                ignoreElements: element => element.classList?.contains('modal-backdrop')
                    || element.classList?.contains('hotel-loading-blocker')
                    || element.classList?.contains('hotel-loading-panel')
                    || element.classList?.contains('hotel-loading-bar'),
                logging: false,
                onclone: clonedDocument => {
                    clonedDocument.documentElement.classList.remove('hotel-dark-mode');
                    clonedDocument.body.classList.remove('hotel-dark-mode', 'modal-open', 'hotel-is-loading');
                    clonedDocument.querySelectorAll('.monthly-bill-slip, .bill-slip-preview').forEach(element => {
                        element.style.background = '#ffffff';
                        element.style.backgroundColor = '#ffffff';
                        element.style.color = '#172033';
                        element.style.boxShadow = 'none';
                    });
                    clonedDocument.querySelectorAll('.monthly-bill-preview-wrap').forEach(element => {
                        element.style.background = '#ffffff';
                        element.style.backgroundColor = '#ffffff';
                    });
                    clonedDocument.querySelectorAll('.monthly-bill-slip *').forEach(element => {
                        element.style.backgroundColor = 'transparent';
                        element.style.color = element.classList.contains('text-muted') ? '#6f7d91' : '#172033';
                    });
                    clonedDocument.querySelectorAll('.monthly-bill-slip .bill-slip-table thead th').forEach(element => {
                        element.style.background = '#f6f9fc';
                        element.style.backgroundColor = '#f6f9fc';
                        element.style.color = '#172033';
                    });
                    clonedDocument.querySelectorAll('.monthly-bill-slip .bill-slip-table tbody td, .monthly-bill-slip .bill-slip-table tfoot th, .monthly-bill-slip .bill-slip-table tfoot td').forEach(element => {
                        element.style.background = '#ffffff';
                        element.style.backgroundColor = '#ffffff';
                    });
                    clonedDocument.querySelectorAll('.monthly-bill-slip .bill-slip-note').forEach(element => {
                        element.style.background = '#ffffff';
                        element.style.backgroundColor = '#ffffff';
                    });
                    clonedDocument.querySelectorAll('.report-print-area').forEach(element => {
                        element.style.background = '#ffffff';
                        element.style.backgroundColor = '#ffffff';
                        element.style.color = '#172033';
                        element.style.padding = '16px';
                    });
                    clonedDocument.querySelectorAll('.report-print-area .card, .report-print-area .card-body, .report-print-area .card-header, .report-print-area .table-responsive').forEach(element => {
                        element.style.background = '#ffffff';
                        element.style.backgroundColor = '#ffffff';
                        element.style.color = '#172033';
                        element.style.borderColor = '#dbe4ef';
                        element.style.boxShadow = 'none';
                    });
                    clonedDocument.querySelectorAll('.report-print-area table, .report-print-area th, .report-print-area td, .report-print-area h3, .report-print-area h5, .report-print-area h6, .report-print-area .fw-bold').forEach(element => {
                        element.style.backgroundColor = element.tagName === 'TH' ? '#f6f9fc' : '#ffffff';
                        element.style.color = '#172033';
                        element.style.borderColor = '#dbe4ef';
                    });
                    clonedDocument.querySelectorAll('.report-print-area .text-muted').forEach(element => {
                        element.style.color = '#6f7d91';
                    });
                },
                scale: Math.min(2, Math.max(1, window.devicePixelRatio || 1)),
                useCORS: true,
                windowWidth: document.documentElement.scrollWidth,
                windowHeight: document.documentElement.scrollHeight
            });
            const inlineStyles = (source, clone) => {
                const sourceNodes = [source, ...source.querySelectorAll('*')];
                const cloneNodes = [clone, ...clone.querySelectorAll('*')];
                sourceNodes.forEach((node, index) => {
                    const target = cloneNodes[index];
                    if (!target) return;
                    const computed = window.getComputedStyle(node);
                    target.style.cssText = Array.from(computed)
                        .map(name => `${name}:${computed.getPropertyValue(name)};`)
                        .join('');
                });
            };
            const captureElement = async (target, title) => {
                if (!target) return;
                try {
                    if (document.fonts?.ready) await document.fonts.ready;
                    if (typeof window.html2canvas === 'function') {
                        const canvas = await window.html2canvas(target, documentCanvasOptions());
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                        if (!blob) throw new Error('Cannot create PNG');
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = `${fileSafeName(title)}.png`;
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                        toast('success', 'บันทึกรูปภาพแล้ว');
                        return;
                    }
                    const rect = target.getBoundingClientRect();
                    const width = Math.ceil(Math.max(target.scrollWidth, rect.width));
                    const height = Math.ceil(Math.max(target.scrollHeight, rect.height));
                    if (!width || !height) throw new Error('Invalid capture size');
                    const clone = target.cloneNode(true);
                    inlineStyles(target, clone);
                    clone.style.boxSizing = 'border-box';
                    clone.style.height = `${height}px`;
                    clone.style.margin = '0';
                    clone.style.width = `${width}px`;
                    const wrapper = document.createElement('div');
                    wrapper.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
                    wrapper.style.background = '#fff';
                    wrapper.style.height = `${height}px`;
                    wrapper.style.overflow = 'hidden';
                    wrapper.style.width = `${width}px`;
                    wrapper.appendChild(clone);
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><foreignObject width="100%" height="100%">${new XMLSerializer().serializeToString(wrapper)}</foreignObject></svg>`;
                    const svgUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
                    const image = new Image();
                    const scale = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.ceil(width * scale);
                    canvas.height = Math.ceil(height * scale);
                    const context = canvas.getContext('2d');
                    context.fillStyle = '#fff';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    await new Promise((resolve, reject) => {
                        image.onload = resolve;
                        image.onerror = reject;
                        image.src = svgUrl;
                    });
                    context.drawImage(image, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(svgUrl);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    if (!blob) throw new Error('Cannot create PNG');
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${fileSafeName(title)}.png`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                    toast('success', 'บันทึกรูปภาพแล้ว');
                } catch (error) {
                    console.error('Document capture failed:', error);
                    toast('warning', 'บันทึกรูปภาพไม่สำเร็จ');
                }
            };
            const captureTarget = modal => {
                const slips = modal.querySelectorAll('.monthly-bill-slip');
                if (slips.length > 1) return modal.querySelector('.monthly-bill-preview-wrap') || slips[0];
                return slips[0] || modal.querySelector('.bill-slip-preview');
            };
            const ensureCaptureButtons = (root = document) => {
                const modals = root.matches?.('.modal')
                    ? [root]
                    : Array.from(root.querySelectorAll?.('.modal') || []);
                modals.forEach(modal => {
                    if (modal.dataset.captureButtonReady === 'true') return;
                    const footer = modal.querySelector('.modal-footer');
                    if (!footer || !captureTarget(modal)) return;
                    modal.dataset.captureButtonReady = 'true';
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'btn btn-light-primary document-capture-btn';
                    button.innerHTML = '<i class="bi bi-camera me-1"></i>บันทึกรูป';
                    button.addEventListener('click', () => {
                        const title = modal.querySelector('.modal-title')?.textContent || 'document';
                        captureElement(captureTarget(modal), title);
                    });
                    const group = footer.querySelector('.d-flex.gap-2:last-child');
                    (group || footer).insertBefore(button, group ? group.firstChild : footer.lastElementChild);
                });
            };
            window.hotelCaptureElement = captureElement;
            window.hotelEnsureDocumentCaptureButtons = ensureCaptureButtons;
            ensureCaptureButtons();
            document.addEventListener('shown.bs.modal', event => ensureCaptureButtons(event.target));
            new MutationObserver(records => {
                records.forEach(record => record.addedNodes.forEach(node => {
                    if (node.nodeType === 1) ensureCaptureButtons(node);
                }));
            }).observe(document.body, { childList: true, subtree: true });
        })();
    </script>
    <script>
        function slideToggle(t, e, o) {
            if (t.style.display === 'none' || window.getComputedStyle(t).display === 'none') slideDown(t, e, o);
            else slideUp(t, e, o);
        }

        function slideUp(t, e, o) {
            const duration = e || 380;
            t.style.height = `${t.scrollHeight}px`;
            t.style.overflow = 'hidden';
            t.style.opacity = '1';
            t.style.transform = 'translateY(0)';
            t.style.transition = `height ${duration}ms cubic-bezier(.2,.8,.2,1), opacity ${duration * .7}ms ease, transform ${duration}ms cubic-bezier(.2,.8,.2,1)`;
            t.offsetHeight;
            t.style.height = '0px';
            t.style.opacity = '0';
            t.style.transform = 'translateY(-.45rem)';
            window.setTimeout(() => {
                t.style.display = 'none';
                t.style.height = '';
                t.style.overflow = '';
                t.style.opacity = '';
                t.style.transform = '';
                t.style.transition = '';
                if (typeof o === 'function') o();
            }, duration);
        }

        function slideDown(t, e, o) {
            const duration = e || 380;
            t.style.display = 'block';
            t.style.height = '0px';
            t.style.overflow = 'hidden';
            t.style.opacity = '0';
            t.style.transform = 'translateY(-.45rem)';
            t.style.transition = `height ${duration}ms cubic-bezier(.2,.8,.2,1), opacity ${duration * .7}ms ease, transform ${duration}ms cubic-bezier(.2,.8,.2,1)`;
            const targetHeight = t.scrollHeight;
            t.offsetHeight;
            t.style.height = `${targetHeight}px`;
            t.style.opacity = '1';
            t.style.transform = 'translateY(0)';
            window.setTimeout(() => {
                t.style.height = '';
                t.style.overflow = '';
                t.style.opacity = '';
                t.style.transform = '';
                t.style.transition = '';
                if (typeof o === 'function') o();
            }, duration);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.innerWidth < 1200) document.getElementById('sidebar')?.classList.remove('active');
        });

        window.addEventListener('resize', () => {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            if (window.innerWidth < 1200) sidebar.classList.remove('active');
            else sidebar.classList.add('active');
        });

        document.querySelector('.burger-btn')?.addEventListener('click', () => {
            document.getElementById('sidebar')?.classList.toggle('active');
        });

        document.querySelector('.sidebar-hide')?.addEventListener('click', () => {
            document.getElementById('sidebar')?.classList.toggle('active');
        });

        if (typeof PerfectScrollbar == 'function') {
            const container = document.querySelector('.sidebar-wrapper');
            if (container) new PerfectScrollbar(container, { wheelPropagation: false });
        }

        const toggleSidebarSubmenu = function (event, link) {
            event.preventDefault();
            event.stopPropagation();
            const item = link.parentElement;
            const submenu = Array.from(item.children).find(child => child.classList?.contains('submenu'));
            if (!submenu) return;

            const wasCollapsed = document.body.classList.contains('hotel-sidebar-collapsed');
            if (wasCollapsed) {
                document.body.classList.remove('hotel-sidebar-collapsed');
                document.getElementById('hotelSidebarToggle')?.setAttribute('aria-pressed', 'false');
                try {
                    localStorage.setItem('hotel-sidebar-collapsed', 'false');
                } catch (error) {
                    /* localStorage can be unavailable in private contexts. */
                }
            }

            const isVisible = window.getComputedStyle(submenu).display !== 'none' && submenu.offsetHeight > 0;
            if (isVisible && !wasCollapsed) {
                item.classList.remove('active');
                submenu.classList.remove('active');
                slideUp(submenu, 380);
            } else {
                item.classList.add('active');
                submenu.classList.add('active');
                slideDown(submenu, 380);
            }
        };

        document.querySelectorAll('.sidebar-item.has-sub > .sidebar-link').forEach(function (link) {
            link.addEventListener('click', function (event) {
                toggleSidebarSubmenu(event, link);
            });
        });

        document.querySelectorAll('.submenu-item.has-sub > .submenu-link').forEach(function (link) {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                const item = link.closest('.submenu-item.has-sub');
                const submenu = item?.querySelector(':scope > .submenu');
                if (!submenu) return;

                if (submenu.classList.contains('active')) {
                    submenu.classList.remove('active');
                    slideUp(submenu, 380);
                } else {
                    submenu.classList.add('active');
                    slideDown(submenu, 380);
                }
            });
        });

        document.querySelectorAll('.sidebar-link[href], .submenu-link[href]').forEach(function (link) {
            const href = link.getAttribute('href');
            if (!href || href === '#') return;
            if (link.pathname === window.location.pathname ||
                (link.pathname !== '/' && window.location.pathname.startsWith(link.pathname))) {
                link.closest('.sidebar-item, .submenu-item')?.classList.add('active');
                link.closest('.sidebar-item')?.classList.add('active');
                link.closest('.menu')?.querySelectorAll('.submenu-item.active').forEach(function (item) {
                    item.closest('.submenu')?.classList.add('active');
                    if (item.closest('.submenu')) item.closest('.submenu').style.display = 'block';
                });
                link.closest('.sidebar-item')?.querySelectorAll('.submenu').forEach(function (submenu) {
                    submenu.classList.add('active');
                    submenu.style.display = 'block';
                });
            }
        });

        document.querySelector('.sidebar-item.active')?.scrollIntoView(false);

        (function () {
            const monthNames = [
                'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
            ];
            const currentBeYear = new Date().getFullYear() + 543;
            const makeOption = (value, label) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                return option;
            };
            const parseIsoDate = value => {
                const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
                return match ? { day: Number(match[3]), month: Number(match[2]), year: Number(match[1]) + 543 } : null;
            };
            const pad = value => String(value).padStart(2, '0');

            document.querySelectorAll('input[type="date"]').forEach(input => {
                if (input.dataset.nativeDate === 'true') return;
                if (input.dataset.thaiDateReady === 'true') return;
                input.dataset.thaiDateReady = 'true';

                if (!input.value && input.dataset.defaultToday === 'true') {
                    const today = new Date();
                    input.value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
                }

                const initial = parseIsoDate(input.value);
                const required = input.required;
                input.required = false;
                input.type = 'hidden';

                const wrapper = document.createElement('div');
                wrapper.className = 'thai-date-picker';

                const daySelect = document.createElement('select');
                daySelect.className = 'form-select';
                daySelect.appendChild(makeOption('', 'วัน'));
                for (let day = 1; day <= 31; day++) daySelect.appendChild(makeOption(day, day));

                const monthSelect = document.createElement('select');
                monthSelect.className = 'form-select';
                monthSelect.appendChild(makeOption('', 'เดือน'));
                monthNames.forEach((name, index) => monthSelect.appendChild(makeOption(index + 1, name)));

                const yearSelect = document.createElement('select');
                yearSelect.className = 'form-select';
                yearSelect.appendChild(makeOption('', 'ปี พ.ศ.'));
                for (let year = currentBeYear + 20; year >= currentBeYear - 130; year--) {
                    yearSelect.appendChild(makeOption(year, year));
                }

                if (required) {
                    daySelect.required = true;
                    monthSelect.required = true;
                    yearSelect.required = true;
                }
                if (initial) {
                    daySelect.value = initial.day;
                    monthSelect.value = initial.month;
                    yearSelect.value = initial.year;
                }

                const syncOriginalInput = () => {
                    const day = Number(daySelect.value);
                    const month = Number(monthSelect.value);
                    const beYear = Number(yearSelect.value);
                    if (!day || !month || !beYear) {
                        input.value = '';
                        return;
                    }
                    const adYear = beYear - 543;
                    const maxDay = new Date(adYear, month, 0).getDate();
                    if (day > maxDay) daySelect.value = maxDay;
                    input.value = `${adYear}-${pad(month)}-${pad(daySelect.value)}`;
                };

                [daySelect, monthSelect, yearSelect].forEach(select => {
                    select.addEventListener('change', syncOriginalInput);
                    wrapper.appendChild(select);
                });
                input.insertAdjacentElement('afterend', wrapper);
                syncOriginalInput();
            });
        })();

        (function () {
            const topOpenModal = () => {
                const modals = Array.from(document.querySelectorAll('.modal.show'));
                return modals.at(-1);
            };

            document.addEventListener('show.bs.modal', event => {
                event.target.setAttribute('data-bs-backdrop', 'true');
                event.target.setAttribute('data-bs-keyboard', 'true');
            });
            document.addEventListener('hide.bs.modal', event => {
                event.target.classList.add('modal-closing');
            });
            document.addEventListener('hidden.bs.modal', event => {
                event.target.classList.remove('modal-closing');
            });
            document.addEventListener('mousedown', event => {
                if (!event.target.classList?.contains('modal') || !event.target.classList.contains('show')) return;
                bootstrap.Modal.getOrCreateInstance(event.target, { backdrop: true, keyboard: true }).hide();
            });
            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape' || document.querySelector('.swal2-container.swal2-shown')) return;
                const modal = topOpenModal();
                if (modal) bootstrap.Modal.getOrCreateInstance(modal, { backdrop: true, keyboard: true }).hide();
            }, true);
        })();

        (function () {
            const pageSizeChoices = [5, 10, 20, 30, 40, 50];
            let activePaginationTable = null;

            const ensurePageSizeModal = () => {
                let modal = document.getElementById('hotelTablePageSizeModal');
                if (modal) return modal;
                modal = document.createElement('div');
                modal.className = 'modal fade';
                modal.id = 'hotelTablePageSizeModal';
                modal.tabIndex = -1;
                modal.innerHTML = `
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">เลือกรายการที่ต้องการแสดง</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="hotel-page-size-options">
                                    ${pageSizeChoices.map(size => `
                                        <button class="btn btn-outline-primary hotel-page-size-choice" type="button" data-page-size="${size}">
                                            ${size} รายการ
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.querySelectorAll('.hotel-page-size-choice').forEach(button => {
                    button.addEventListener('click', () => {
                        if (!activePaginationTable) return;
                        activePaginationTable.dataset.pageSize = button.dataset.pageSize;
                        activePaginationTable.dataset.page = '1';
                        renderTablePagination(activePaginationTable);
                        bootstrap.Modal.getOrCreateInstance(modal).hide();
                    });
                });
                return modal;
            };

            const getDataRows = table => Array.from(table.tBodies[0]?.rows || [])
                .filter(row => row.cells.length > 1 && !row.classList.contains('hotel-pagination-ignore'));

            const renderTablePagination = table => {
                const controls = table.dataset.paginationControlsId
                    ? document.getElementById(table.dataset.paginationControlsId)
                    : null;
                if (!controls) return;
                const rows = getDataRows(table);
                const pageSize = Math.min(50, Math.max(5, Number(table.dataset.pageSize || 5)));
                const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
                const page = Math.min(totalPages, Math.max(1, Number(table.dataset.page || 1)));
                table.dataset.page = String(page);
                table.dataset.pageSize = String(pageSize);

                const start = (page - 1) * pageSize;
                const end = start + pageSize;
                rows.forEach((row, index) => row.classList.toggle('d-none', index < start || index >= end));

                const from = rows.length ? start + 1 : 0;
                const to = Math.min(end, rows.length);
                controls.querySelector('.hotel-table-page-info').textContent = `${from}-${to} จาก ${rows.length} รายการ`;
                const pageList = controls.querySelector('.hotel-page-list');
                if (pageList) {
                    const groupStart = Math.floor((page - 1) / 10) * 10 + 1;
                    const groupEnd = Math.min(totalPages, groupStart + 9);
                    pageList.innerHTML = '';
                    const prevItem = document.createElement('li');
                    prevItem.className = `page-item${page <= 1 ? ' disabled' : ''}`;
                    const prevButton = document.createElement('button');
                    prevButton.className = 'page-link hotel-page-prev';
                    prevButton.type = 'button';
                    prevButton.textContent = 'ก่อนหน้า';
                    prevButton.disabled = page <= 1;
                    prevButton.addEventListener('click', () => {
                        table.dataset.page = String(Math.max(1, Number(table.dataset.page || 1) - 1));
                        renderTablePagination(table);
                    });
                    prevItem.appendChild(prevButton);
                    pageList.appendChild(prevItem);
                    for (let pageNumber = groupStart; pageNumber <= groupEnd; pageNumber++) {
                        const item = document.createElement('li');
                        item.className = `page-item${pageNumber === page ? ' active' : ''}`;
                        const button = document.createElement('button');
                        button.className = 'page-link';
                        button.type = 'button';
                        button.textContent = String(pageNumber);
                        button.addEventListener('click', () => {
                            table.dataset.page = String(pageNumber);
                            renderTablePagination(table);
                        });
                        item.appendChild(button);
                        pageList.appendChild(item);
                    }
                    const nextItem = document.createElement('li');
                    nextItem.className = `page-item${page >= totalPages ? ' disabled' : ''}`;
                    const nextButton = document.createElement('button');
                    nextButton.className = 'page-link hotel-page-next';
                    nextButton.type = 'button';
                    nextButton.textContent = 'ถัดไป';
                    nextButton.disabled = page >= totalPages;
                    nextButton.addEventListener('click', () => {
                        table.dataset.page = String(Number(table.dataset.page || 1) + 1);
                        renderTablePagination(table);
                    });
                    nextItem.appendChild(nextButton);
                    pageList.appendChild(nextItem);
                }
            };

            const initTablePagination = (root = document) => {
                root.querySelectorAll('table.table:not(.bill-slip-table)').forEach((table, index) => {
                    if (table.dataset.paginationReady === 'true') {
                        renderTablePagination(table);
                        return;
                    }
                const rows = getDataRows(table);
                if (rows.length <= 5) {
                    table.classList.remove('hotel-pagination-pending');
                    return;
                }
                table.dataset.paginationReady = 'true';
                    table.dataset.pageSize = table.dataset.pageSize || '5';
                    table.dataset.page = table.dataset.page || '1';
                    const controls = document.createElement('div');
                    const controlsId = `hotelTablePagination${Date.now()}${index}`;
                    controls.id = controlsId;
                    controls.className = 'hotel-table-pagination';
                    controls.innerHTML = `
                        <nav aria-label="Table pagination">
                            <ul class="pagination pagination-primary pagination-sm justify-content-center hotel-page-list"></ul>
                        </nav>
                        <div class="hotel-table-page-info"></div>
                    `;
                    table.dataset.paginationControlsId = controlsId;
                    table.closest('.table-responsive')?.insertAdjacentElement('afterend', controls);
                    table.addEventListener('hotel:table-sorted', () => {
                        table.dataset.page = '1';
                        renderTablePagination(table);
                    });
                    renderTablePagination(table);
                    table.classList.remove('hotel-pagination-pending');
                });
            };

            window.hotelInitTablePagination = initTablePagination;
            window.hotelRefreshTablePagination = table => renderTablePagination(table);
            document.addEventListener('DOMContentLoaded', () => initTablePagination());
            initTablePagination();
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    mutation.addedNodes.forEach(node => {
                        if (node.nodeType === 1) initTablePagination(node);
                    });
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
        })();

        (function () {
            const parseValue = (text) => {
                const value = (text || '').replace(/\s+/g, ' ').trim();
                if (!value || value === '-') return { type: 'empty', value: '' };

                const thaiDate = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(value);
                if (thaiDate) {
                    return {
                        type: 'date',
                        value: new Date(Number(thaiDate[3]) - 543, Number(thaiDate[2]) - 1, Number(thaiDate[1])).getTime()
                    };
                }

                const numberValue = Number(value.replace(/,/g, '').replace(/[^\d.-]/g, ''));
                if (Number.isFinite(numberValue) && /\d/.test(value)) {
                    return { type: 'number', value: numberValue };
                }

                return { type: 'text', value: value.toLocaleLowerCase('th-TH') };
            };

            const compareValues = (left, right) => {
                if (left.type === 'empty' && right.type !== 'empty') return 1;
                if (right.type === 'empty' && left.type !== 'empty') return -1;
                if (left.type === 'number' && right.type === 'number') return left.value - right.value;
                if (left.type === 'date' && right.type === 'date') return left.value - right.value;
                return String(left.value).localeCompare(String(right.value), 'th-TH', { numeric: true });
            };

            const initSortableTables = (root = document) => {
                const tables = root instanceof Element && root.matches('table.table:not(.bill-slip-table)')
                    ? [root]
                    : root.querySelectorAll('table.table:not(.bill-slip-table)');
                tables.forEach(table => {
                if (table.dataset.sortReady === 'true') return;
                table.dataset.sortReady = 'true';
                const headerRow = table.querySelector('thead tr');
                const body = table.tBodies[0];
                if (!headerRow || !body) return;

                Array.from(headerRow.cells).forEach((header, columnIndex) => {
                    if (header.dataset.sortDisabled === 'true') return;
                    if (!header.textContent.trim()) return;
                    header.classList.add('hotel-sortable');
                    header.tabIndex = 0;
                    header.setAttribute('role', 'button');

                    const sortTable = () => {
                        const direction = header.dataset.sortDirection === 'asc' ? 'desc' : 'asc';
                        headerRow.querySelectorAll('.hotel-sortable').forEach(item => {
                            item.classList.remove('is-sorted-asc', 'is-sorted-desc');
                            delete item.dataset.sortDirection;
                        });
                        header.dataset.sortDirection = direction;
                        header.classList.add(direction === 'asc' ? 'is-sorted-asc' : 'is-sorted-desc');

                        const rows = Array.from(body.rows);
                        rows.sort((leftRow, rightRow) => {
                            const left = parseValue(leftRow.cells[columnIndex]?.innerText);
                            const right = parseValue(rightRow.cells[columnIndex]?.innerText);
                            const result = compareValues(left, right);
                            return direction === 'asc' ? result : -result;
                        });
                        rows.forEach(row => body.appendChild(row));
                        table.dispatchEvent(new CustomEvent('hotel:table-sorted'));
                    };

                    header.addEventListener('click', sortTable);
                    header.addEventListener('keydown', event => {
                        if (event.key !== 'Enter' && event.key !== ' ') return;
                        event.preventDefault();
                        sortTable();
                    });
                });
            });
            };

            window.hotelInitSortableTables = initSortableTables;
            document.addEventListener('DOMContentLoaded', () => initSortableTables());
            initSortableTables();
        })();
    </script>
</div>
