<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title + ' - ' + (systemName != null ? systemName : 'BlueCatHotelDemo')}">BlueCatHotelDemo</title>
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('hotel-theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.classList.toggle('hotel-dark-mode', theme === 'dark');
                document.documentElement.classList.toggle('hotel-sidebar-collapsed', localStorage.getItem('hotel-sidebar-collapsed') === 'true');
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/mazer/dist/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/mazer/dist/assets/vendors/perfect-scrollbar/perfect-scrollbar.css}">
    <link rel="stylesheet" th:href="@{/mazer/dist/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/mazer/dist/assets/vendors/choices.js/choices.min.css}">
    <link rel="stylesheet" th:href="@{/mazer/dist/assets/vendors/sweetalert2/sweetalert2.min.css}">
    <link rel="stylesheet" th:href="@{/mazer/dist/assets/css/app.css}">
    <style>
        :root {
            --hotel-ink: #172033;
            --hotel-muted: #6f7d91;
            --hotel-line: #e4e9f2;
            --hotel-panel: #ffffff;
            --hotel-bg: #f4f7fb;
            --hotel-primary: #1f5f8b;
            --hotel-primary-strong: #174a70;
            --hotel-green: #3D9013;
            --hotel-orange: #FE9A37;
            --hotel-red: #CD5C5C;
            --hotel-blue: #4f73d9;
            --hotel-gray: #747b88;
        }

        html, body {
            background: var(--hotel-bg);
            color: var(--hotel-ink);
            font-family: "Inter", "Noto Sans Thai", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        #main {
            background:
                linear-gradient(180deg, rgba(31, 95, 139, .08), rgba(31, 95, 139, 0) 16rem),
                var(--hotel-bg);
            min-height: 100vh;
            padding-top: 5.5rem;
        }

        .app-topbar {
            align-items: center;
            backdrop-filter: blur(14px);
            background: rgba(255, 255, 255, .92);
            border-bottom: 1px solid var(--hotel-line);
            box-shadow: 0 .6rem 1.8rem rgba(23, 32, 51, .06);
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            left: 0;
            min-height: 4.25rem;
            padding: .75rem 1.75rem;
            position: fixed;
            right: 0;
            top: 0;
            z-index: 1300;
        }

        .topbar-spacer {
            flex: 1 1 auto;
        }

        .topbar-system-name {
            color: var(--hotel-ink);
            display: block;
            font-size: 1.05rem;
            font-weight: 900;
            line-height: 1.2;
            max-width: min(28rem, 40vw);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-title {
            color: var(--hotel-ink);
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0;
            line-height: 1.1;
            margin: 0;
        }

        .topbar-subtitle {
            color: var(--hotel-muted);
            font-size: .82rem;
            font-weight: 700;
            margin: .15rem 0 0;
        }

        .topbar-actions {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            justify-content: flex-end;
        }

        .topbar-notification-btn {
            align-items: center;
            background: #f6f9fc;
            border: 1px solid var(--hotel-line);
            border-radius: 50%;
            color: var(--hotel-ink);
            display: inline-flex;
            height: 2.55rem;
            justify-content: center;
            padding: 0;
            position: relative;
            width: 2.55rem;
        }

        .topbar-notification-btn:hover,
        .topbar-notification-btn:focus {
            background: #eaf2f8;
            border-color: #8db2cc;
            color: #1f5f8b;
        }

        .topbar-notification-btn .bi {
            font-size: 1.1rem;
            line-height: 1;
        }

        .notification-badge {
            align-items: center;
            background: #d9495d;
            border: 2px solid #fff;
            border-radius: 999px;
            color: #fff;
            display: inline-flex;
            font-size: .66rem;
            font-weight: 800;
            justify-content: center;
            line-height: 1;
            min-height: 1.2rem;
            min-width: 1.2rem;
            padding: .12rem .28rem;
            position: absolute;
            right: -.38rem;
            top: -.38rem;
        }

        .notification-dropdown {
            border: 1px solid var(--hotel-line);
            border-radius: .5rem;
            box-shadow: 0 1rem 2.5rem rgba(23, 32, 51, .16);
            margin-top: .7rem;
            max-height: min(31rem, calc(100vh - 6rem));
            min-width: 22rem;
            overflow-y: auto;
            padding: 0;
        }

        .notification-dropdown-header {
            align-items: center;
            border-bottom: 1px solid var(--hotel-line);
            display: flex;
            justify-content: space-between;
            padding: .9rem 1rem;
        }

        .notification-section + .notification-section {
            border-top: 1px solid var(--hotel-line);
        }

        .notification-section-title,
        .notification-item {
            color: var(--hotel-ink);
            text-decoration: none;
        }

        .notification-section-title {
            align-items: center;
            display: flex;
            font-size: .84rem;
            font-weight: 800;
            justify-content: space-between;
            padding: .8rem 1rem .45rem;
        }

        .notification-section-title:hover { color: #1f5f8b; }

        .notification-item {
            align-items: center;
            display: flex;
            gap: .65rem;
            padding: .55rem 1rem;
        }

        .notification-item:hover { background: #f5f8fb; }

        .notification-item-icon {
            align-items: center;
            border-radius: 50%;
            display: inline-flex;
            flex: 0 0 2rem;
            height: 2rem;
            justify-content: center;
            width: 2rem;
        }

        .notification-item-icon-warning { background: #fff3d8; color: #b67500; }
        .notification-item-icon-danger { background: #fde4e7; color: #c33d50; }

        .notification-item-content {
            display: grid;
            flex: 1 1 auto;
            min-width: 0;
        }

        .notification-item-content span,
        .notification-item small {
            color: var(--hotel-muted);
            font-size: .78rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .notification-item small { max-width: 7.5rem; text-align: right; }

        .notification-empty {
            align-items: center;
            color: var(--hotel-muted);
            display: flex;
            flex-direction: column;
            gap: .55rem;
            padding: 2.25rem 1rem;
        }

        .notification-empty .bi { font-size: 1.55rem; }

        .topbar-user {
            align-items: center;
            background: #f6f9fc;
            border: 1px solid var(--hotel-line);
            border-radius: 999px;
            color: #4f5e72;
            display: inline-flex;
            font-size: .9rem;
            font-weight: 800;
            gap: .45rem;
            min-height: 2.55rem;
            padding: .45rem .85rem;
        }

        .theme-toggle-btn {
            align-items: center;
            border-radius: 999px;
            display: inline-flex;
            gap: .45rem;
            justify-content: center;
            line-height: 1;
            min-height: 2.55rem;
            padding: .45rem .85rem;
        }

        .theme-toggle-btn i {
            align-items: center;
            display: inline-flex;
            height: 1rem;
            justify-content: center;
            line-height: 1;
            width: 1rem;
        }

        .theme-toggle-btn .theme-toggle-text {
            line-height: 1;
        }

        .sidebar-collapse-btn {
            align-items: center;
            border-radius: 999px;
            display: inline-flex;
            justify-content: center;
            min-height: 2.55rem;
            padding: 0;
            width: 2.75rem;
        }

        .sidebar-collapse-btn i {
            align-items: center;
            display: inline-flex;
            height: 1.25rem;
            justify-content: center;
            line-height: 1;
            margin: 0;
            width: 1.25rem;
        }

        #sidebar,
        .sidebar-wrapper,
        #main,
        .app-topbar,
        .sidebar-wrapper .sidebar-header,
        .sidebar-wrapper .menu,
        .brand-mark,
        .sidebar-wrapper .sidebar-header .brand-mark img,
        .sidebar-wrapper .menu .sidebar-link,
        .sidebar-wrapper .menu .sidebar-link span,
        .sidebar-wrapper .menu .sidebar-title,
        .sidebar-collapse-btn i {
            transition:
                width .3s cubic-bezier(.2, .8, .2, 1),
                margin .3s cubic-bezier(.2, .8, .2, 1),
                padding .3s cubic-bezier(.2, .8, .2, 1),
                left .3s cubic-bezier(.2, .8, .2, 1),
                opacity .2s ease,
                transform .3s cubic-bezier(.2, .8, .2, 1),
                max-width .3s cubic-bezier(.2, .8, .2, 1),
                max-height .3s cubic-bezier(.2, .8, .2, 1);
        }

        .sidebar-wrapper .menu .sidebar-link span,
        .sidebar-wrapper .menu .sidebar-title {
            max-width: 14rem;
            opacity: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .theme-toggle-btn .theme-dark-icon,
        .hotel-dark-mode .theme-toggle-btn .theme-light-icon {
            display: none;
        }

        .hotel-dark-mode .theme-toggle-btn .theme-dark-icon {
            display: inline-flex;
        }

        .sidebar-wrapper {
            border-right: 1px solid var(--hotel-line);
            box-shadow: .5rem 0 2rem rgba(23, 32, 51, .04);
            padding-top: 4.25rem;
        }

        .sidebar-wrapper .sidebar-header {
            min-height: 1rem;
            padding: .75rem 1rem 0;
        }

        .sidebar-wrapper .menu {
            padding: 0;
        }

        .sidebar-wrapper .menu .sidebar-title {
            color: #98a4b5;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .sidebar-wrapper .menu .sidebar-link {
            border-radius: .55rem;
            color: #4f5e72;
            font-weight: 700;
            margin: .12rem 0;
            padding: .72rem .65rem;
        }

        .sidebar-wrapper .menu .sidebar-link i {
            align-items: center;
            color: var(--hotel-primary);
            display: inline-flex;
            flex: 0 0 1.25rem;
            height: 1.25rem;
            justify-content: center;
            line-height: 1;
            width: 1.25rem;
        }

        .sidebar-wrapper .menu .submenu-link i {
            color: var(--hotel-primary);
            margin-right: .45rem;
        }

        .sidebar-wrapper .menu .submenu {
            padding-left: .65rem;
        }

        .sidebar-wrapper .menu .submenu .submenu-link {
            padding-left: .75rem;
        }

        .sidebar-wrapper .menu .has-sub > .sidebar-link::after,
        .sidebar-wrapper .menu .submenu-item.has-sub > .submenu-link::after {
            transition: transform .38s cubic-bezier(.2, .8, .2, 1);
        }

        .sidebar-wrapper .menu .has-sub.active > .sidebar-link::after,
        .sidebar-wrapper .menu .submenu-item.has-sub.active > .submenu-link::after {
            transform: rotate(180deg);
        }

        .sidebar-wrapper .menu .sidebar-item.active > .sidebar-link,
        .sidebar-wrapper .menu .sidebar-link:hover {
            background: #e8f2f8;
            color: var(--hotel-primary-strong) !important;
            opacity: 1 !important;
        }

        .sidebar-wrapper .menu .sidebar-item.active > .sidebar-link span,
        .sidebar-wrapper .menu .sidebar-item.active > .sidebar-link i,
        .sidebar-wrapper .menu .sidebar-link:hover span,
        .sidebar-wrapper .menu .sidebar-link:hover i {
            background: transparent !important;
            color: var(--hotel-primary-strong) !important;
            opacity: 1 !important;
        }

        .sidebar-wrapper .menu .sidebar-item.active > .sidebar-link {
            border: 1px solid #c8dfed;
            box-shadow: inset .25rem 0 0 var(--hotel-primary);
        }

        .brand-mark {
            align-items: center;
            color: var(--hotel-ink);
            display: inline-flex;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 900;
            line-height: 1.2;
            min-height: 3rem;
            padding: .5rem .75rem;
            text-align: center;
            width: 100%;
        }

        .brand-mark span {
            overflow-wrap: anywhere;
        }

        .brand-mark img,
        .auth-brand-logo {
            object-fit: contain;
        }

        .sidebar-wrapper .sidebar-header .brand-mark img {
            height: 10rem;
            max-height: none;
            width: 10rem;
        }

        @media (min-width: 1200px) {
            body.hotel-sidebar-collapsed #sidebar,
            html.hotel-sidebar-collapsed body #sidebar,
            body.hotel-sidebar-collapsed .sidebar-wrapper,
            html.hotel-sidebar-collapsed body .sidebar-wrapper {
                width: 5.25rem;
            }

            body.hotel-sidebar-collapsed #main,
            html.hotel-sidebar-collapsed body #main {
                margin-left: 5.25rem;
            }

            body.hotel-sidebar-collapsed .app-topbar,
            html.hotel-sidebar-collapsed body .app-topbar {
                left: 0;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .sidebar-header,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .sidebar-header {
                padding-left: .55rem;
                padding-right: .55rem;
            }

            body.hotel-sidebar-collapsed .brand-mark,
            html.hotel-sidebar-collapsed body .brand-mark {
                font-size: .95rem;
                min-height: 3.25rem;
                overflow: hidden;
                padding: .45rem .25rem;
            }

            body.hotel-sidebar-collapsed .brand-mark span,
            html.hotel-sidebar-collapsed body .brand-mark span {
                max-width: 3.4rem;
                opacity: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                transform: translateX(-.4rem);
                white-space: nowrap;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .sidebar-header .brand-mark img,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .sidebar-header .brand-mark img {
                height: 3.75rem;
                width: 3.75rem;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu {
                padding-left: .45rem;
                padding-right: .45rem;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .sidebar-title,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .sidebar-title,
            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .sidebar-link span,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .sidebar-link span {
                margin-left: 0;
                max-height: 0;
                max-width: 0;
                opacity: 0;
                padding: 0;
                pointer-events: none;
                transform: translateX(-.45rem);
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .submenu,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .submenu {
                display: none !important;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .sidebar-link:not(:has(i))::before,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .sidebar-link:not(:has(i))::before {
                content: attr(data-menu-short);
                font-weight: 900;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .sidebar-link i,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .sidebar-link i {
                margin-right: 0;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .sidebar-link,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .sidebar-link {
                align-items: center;
                display: flex;
                justify-content: center;
                margin-left: 0;
                margin-right: 0;
                min-height: 2.75rem;
                padding: .7rem;
            }

            body.hotel-sidebar-collapsed .sidebar-wrapper .menu .sidebar-item.has-sub > .sidebar-link::after,
            html.hotel-sidebar-collapsed body .sidebar-wrapper .menu .sidebar-item.has-sub > .sidebar-link::after {
                display: none;
            }

            body.hotel-sidebar-collapsed .sidebar-collapse-btn i,
            html.hotel-sidebar-collapsed body .sidebar-collapse-btn i {
                transform: rotate(180deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #sidebar,
            .sidebar-wrapper,
            #main,
            .app-topbar,
            .sidebar-wrapper .sidebar-header,
            .sidebar-wrapper .menu,
            .brand-mark,
            .sidebar-wrapper .sidebar-header .brand-mark img,
            .sidebar-wrapper .menu .sidebar-link,
            .sidebar-wrapper .menu .sidebar-link span,
            .sidebar-wrapper .menu .sidebar-title,
            .sidebar-collapse-btn i {
                transition: none;
            }
        }

        body.hotel-sidebar-transitioning .sidebar-wrapper {
            transition: width .5s cubic-bezier(.22, 1, .36, 1) !important;
        }

        body.hotel-sidebar-transitioning #main {
            transition: margin-left .5s cubic-bezier(.22, 1, .36, 1) !important;
        }

        body.hotel-sidebar-transitioning .app-topbar {
            transition: left .5s cubic-bezier(.22, 1, .36, 1) !important;
        }

        body.hotel-sidebar-transitioning .sidebar-wrapper .sidebar-header,
        body.hotel-sidebar-transitioning .sidebar-wrapper .menu,
        body.hotel-sidebar-transitioning .brand-mark,
        body.hotel-sidebar-transitioning .sidebar-wrapper .menu .sidebar-link,
        body.hotel-sidebar-transitioning .sidebar-wrapper .menu .sidebar-link span {
            transition:
                margin .5s cubic-bezier(.22, 1, .36, 1),
                padding .5s cubic-bezier(.22, 1, .36, 1),
                opacity .3s ease,
                transform .5s cubic-bezier(.22, 1, .36, 1),
                max-width .5s cubic-bezier(.22, 1, .36, 1),
                max-height .5s cubic-bezier(.22, 1, .36, 1) !important;
        }

        body.hotel-sidebar-transitioning .sidebar-collapse-btn {
            animation: hotel-sidebar-toggle-pulse .5s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes hotel-sidebar-toggle-pulse {
            0% { transform: scale(1); }
            45% { transform: scale(.88); }
            100% { transform: scale(1); }
        }

        .auth-brand-logo {
            height: 4rem;
            width: 4rem;
        }

        .page-heading {
            align-items: end;
            background: var(--hotel-panel);
            border: 1px solid var(--hotel-line);
            border-radius: .65rem;
            box-shadow: 0 .8rem 2rem rgba(23, 32, 51, .05);
            margin-bottom: 1.25rem;
            padding: 1.15rem 1.25rem;
        }

        .page-heading h3 {
            color: var(--hotel-ink);
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0;
            margin-bottom: .25rem;
        }

        .text-subtitle,
        .text-muted {
            color: var(--hotel-muted) !important;
        }

        .card {
            border: 1px solid var(--hotel-line);
            border-radius: .65rem;
            box-shadow: 0 .75rem 1.8rem rgba(23, 32, 51, .055);
        }

        .card .card-body {
            padding: 1.25rem;
        }

        .btn {
            border-radius: .5rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        .btn-primary {
            background: var(--hotel-primary);
            border-color: var(--hotel-primary);
            box-shadow: 0 .45rem 1rem rgba(31, 95, 139, .2);
        }

        .btn-primary:hover {
            background: var(--hotel-primary-strong);
            border-color: var(--hotel-primary-strong);
        }

        .btn-light-primary {
            background: #e8f2f8;
            border-color: #d7e8f2;
            color: var(--hotel-primary-strong);
        }

        .form-control,
        .form-select,
        .input-group-text {
            border-color: var(--hotel-line);
            border-radius: .5rem;
            color: var(--hotel-ink);
            min-height: 2.65rem;
        }

        input[type="number"],
        .money-field {
            text-align: right;
        }

        .thai-date-picker {
            display: grid;
            gap: .5rem;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            max-width: 100%;
            min-width: 0;
        }

        .thai-date-picker .form-select {
            min-width: 0;
            overflow: hidden;
            padding-left: .65rem;
            padding-right: 2rem;
            text-overflow: ellipsis;
        }

        @media (max-width: 575.98px) {
            .thai-date-picker {
                grid-template-columns: 1fr;
            }
        }

        .form-label {
            color: #526176;
            font-size: .82rem;
            font-weight: 800;
            margin-bottom: .4rem;
        }

        .picture-radio-group {
            display: grid;
            gap: .75rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .picture-radio {
            cursor: pointer;
            display: block;
            margin: 0;
            position: relative;
        }

        .picture-radio input {
            height: 1px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            width: 1px;
        }

        .picture-radio-card {
            align-items: center;
            background: #f6f9fc;
            border: 1px solid var(--hotel-line);
            border-radius: .65rem;
            color: #526176;
            display: flex;
            font-weight: 900;
            gap: .65rem;
            min-height: 3.65rem;
            padding: .75rem .9rem;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
        }

        .picture-radio-card i {
            align-items: center;
            border-radius: .55rem;
            display: inline-flex;
            flex: 0 0 auto;
            font-size: 1.25rem;
            height: 2.1rem;
            justify-content: center;
            width: 2.1rem;
        }

        .picture-radio-active .picture-radio-card i {
            background: rgba(61, 144, 19, .14);
            color: var(--hotel-green);
        }

        .picture-radio-inactive .picture-radio-card i {
            background: rgba(205, 92, 92, .14);
            color: var(--hotel-red);
        }

        .picture-radio input:checked + .picture-radio-card {
            background: #fff;
            border-color: var(--hotel-primary);
            box-shadow: 0 .55rem 1.35rem rgba(31, 95, 139, .14);
            color: var(--hotel-ink);
        }

        .picture-radio-active input:checked + .picture-radio-card {
            background: var(--hotel-green);
            border-color: rgba(61, 144, 19, .55);
            color: #fff;
        }

        .picture-radio-inactive input:checked + .picture-radio-card {
