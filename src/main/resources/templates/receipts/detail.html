<!doctype html>
<html lang="th">
<head th:replace="~{fragments/head :: head('ใบเสร็จรับเงิน')}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div id="main">
        <header class="mb-3"><a href="#" class="burger-btn d-block d-xl-none"><i class="bi bi-justify fs-3"></i></a></header>
        <div class="page-heading d-flex justify-content-between align-items-center">
            <h3 th:text="${currentMenuName}"></h3>
            <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i>พิมพ์</button>
        </div>

        <div class="page-content">
            <section class="section">
                <div class="monthly-bill-preview-wrap">
                    <div class="monthly-bill-slip">
                        <div class="bill-slip-header">
                            <div>
                                <h4 th:text="${systemName}">BlueCatHotelDemo</h4>
                                <div class="document-bilingual-label"><span>ใบเสร็จรับเงิน</span><small>Receipt</small></div>
                            </div>
                            <div class="bill-slip-number">
                                <strong class="document-bilingual-label"><span th:text="|ห้อง ${payment.room != null ? payment.room.roomNumber : (payment.guest != null and payment.guest.room != null ? payment.guest.room.roomNumber : '-')}|"></span><small th:text="|Room ${payment.room != null ? payment.room.roomNumber : (payment.guest != null and payment.guest.room != null ? payment.guest.room.roomNumber : '-')}|"></small></strong>
                                <span class="document-bilingual-label"><span th:text="|เลขใบเสร็จ #${receiptNo != null and !#strings.isEmpty(receiptNo) ? receiptNo : '-'}|"></span><small th:text="|Receipt No. #${receiptNo != null and !#strings.isEmpty(receiptNo) ? receiptNo : '-'}|"></small></span>
                                <span class="document-bilingual-label"><span th:text="|เลขที่ใบแจ้งค่าเช่า #${billNumber != null and billNumber != '-' ? billNumber : '-'}|"></span><small th:text="|Invoice No. #${billNumber != null and billNumber != '-' ? billNumber : '-'}|"></small></span>
                            </div>
                        </div>

                        <div class="bill-slip-meta">
                            <div><span class="document-bilingual-label"><span>รับจาก</span><small>Received From</small></span><strong th:text="${payerName != null ? payerName : '-'}"></strong></div>
                            <div><span class="document-bilingual-label"><span>วันที่ชำระ</span><small>Payment Date</small></span><strong th:text="${@thaiDate.format(payment.paymentDate)}"></strong></div>
                            <div class="bill-slip-due-date"><span class="document-bilingual-label"><span>วิธีชำระ</span><small>Payment Method</small></span><strong th:text="${payment.paymentMethod != null ? payment.paymentMethod : '-'}"></strong></div>
                        </div>

                        <table class="bill-slip-table">
                            <thead>
                            <tr>
                                <th><span class="document-bilingual-label"><span>รายการ</span><small>Item</small></span></th>
                                <th class="text-end"><span class="document-bilingual-label text-end"><span>จำนวนหน่วย</span><small>Units</small></span></th>
                                <th class="text-end"><span class="document-bilingual-label text-end"><span>ราคาต่อหน่วย</span><small>Unit Price</small></span></th>
                                <th class="text-end"><span class="document-bilingual-label text-end"><span>จำนวนเงิน</span><small>Amount</small></span></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${receiptItems}">
                                <td th:text="${item.label}">รายการ</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(item.units, 1, 'COMMA', 0, 'POINT')}">1</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(item.amount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                            </tr>
                            </tbody>
                            <tfoot>
                            <tr class="bill-slip-total">
                                <th colspan="3"><span class="document-bilingual-label"><span>รวมรับชำระ</span><small>Total Received</small></span></th>
                                <th class="text-end" th:text="|${#numbers.formatDecimal(payment.amount, 1, 'COMMA', 2, 'POINT')} บาท|">0.00 บาท</th>
                            </tr>
                            </tfoot>
                        </table>

                        <div class="bill-slip-note" th:if="${payment.remark != null and !#strings.isEmpty(payment.remark)}">
                            <span>หมายเหตุ</span>
                            <div th:text="${payment.remark}"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<div th:replace="~{fragments/nav :: scripts}"></div>
</body>
</html>
